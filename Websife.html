<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#353a55">
<title>Player Animator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<style>
:root{
  --ink:#12111a; --lane:#181722; --label:#292839; --label-2:#30304a;
  --title-a:#454a66; --title-b:#353a55; --pill-a:#6a759f; --pill-b:#4f5981;
  --text:#f3f4fc; --muted:#a0a5c6; --edge:#4a4f78;
  --cyan:#6fdcff; --red:#ff5d62; --yellow:#ffd34d; --orange:#ff9a3d;
  --ax-x:#ff5c5c; --ax-y:#5ce670; --ax-z:#6a86ff; --ax-xz:#c58bff;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --label-w:146px; --ruler-h:46px; --pad:20px;
  --ease-out:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--ink);color:var(--text);
  font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;-webkit-user-select:text;user-select:text}
:focus{outline:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- 3D stage ---------- */
#stage{position:relative;flex:1 1 0;min-height:110px;overflow:hidden;
  background:radial-gradient(120% 95% at 50% 40%,#3a3f66 0%,#222540 52%,#13131f 100%)}
#stage canvas{position:absolute;inset:0;display:block}
.chip{position:absolute;left:12px;top:12px;max-width:calc(100% - 24px);padding:7px 14px;border-radius:999px;
  background:rgba(24,24,38,.66);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.09);font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.chip b{color:#fff;font-weight:600}
.chip i{font-style:normal;color:var(--cyan);font-weight:600}
#toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  padding:9px 16px;border-radius:14px;background:rgba(14,14,24,.9);border:1px solid rgba(255,255,255,.1);
  font-size:13px;max-width:calc(100% - 32px);text-align:center;transition:opacity .2s,transform .25s var(--ease-out);z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Timeline panel ---------- */
#tl{position:relative;flex:none;display:flex;flex-direction:column;background:var(--label);
  border-radius:22px 22px 0 0;box-shadow:0 -14px 38px rgba(0,0,0,.55);overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom)}
#grip{position:absolute;left:0;right:0;top:0;height:20px;z-index:45;cursor:ns-resize;touch-action:none;display:flex;justify-content:center;padding-top:6px}
#grip::before{content:"";width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.28)}
#titlebar{flex:none;position:relative;z-index:40;height:72px;padding:16px 10px 0;display:flex;align-items:center;gap:6px;
  background:linear-gradient(180deg,var(--title-a),var(--title-b));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 16px -8px rgba(0,0,0,.65)}
.tb-l{flex:none;display:flex;align-items:center;gap:4px}
.tb-r{flex:none;min-width:0;display:flex;align-items:center;gap:6px}
.ib{width:42px;height:42px;padding:0;border:0;border-radius:13px;background:transparent;display:grid;place-items:center;
  transition:background .15s,transform .12s}
.ib svg{width:30px;height:30px;overflow:visible}
.ib:hover{background:rgba(255,255,255,.07)}
.ib:active{transform:scale(.9);background:rgba(255,255,255,.14)}
.play{margin:0 auto;width:54px;height:46px;padding:0;border:0;background:transparent;display:grid;place-items:center;transition:transform .12s}
.play svg{width:40px;height:40px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.4))}
.play:active{transform:scale(.9)}
.play .i-pause{display:none}
.play.on .i-play{display:none}
.play.on .i-pause{display:block}
.pill{height:42px;min-width:48px;padding:0 15px;border:0;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-size:17px;font-weight:500;line-height:1;white-space:nowrap;
  background:linear-gradient(180deg,var(--pill-a),var(--pill-b));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -2px 0 rgba(0,0,0,.14),0 3px 8px rgba(0,0,0,.35);
  transition:transform .12s,filter .15s}
.pill:active{transform:scale(.95)}
.pill[aria-expanded="true"]{filter:brightness(1.15)}
#btnEase .nm{max-width:150px;overflow:hidden;text-overflow:ellipsis}
#btnEase .gl{display:inline-flex;width:20px;height:20px}
#btnEase .gl svg{width:20px;height:20px}
#btnEase .car{width:15px;height:11px}

/* ---------- Timeline scroller ---------- */
#scroller{position:relative;flex:1 1 0;min-height:0;overflow:auto;background:var(--lane);overscroll-behavior:contain;
  touch-action:pan-x pan-y;scrollbar-width:thin;scrollbar-color:#454a75 transparent}
#content{position:relative;min-width:100%;width:calc(var(--label-w) + var(--lane-w,800px))}
#rulerRow{position:sticky;top:0;z-index:20;display:flex;height:var(--ruler-h)}
#corner{position:sticky;left:0;z-index:30;flex:none;width:var(--label-w);height:var(--ruler-h);background:var(--label);
  display:flex;align-items:baseline;gap:6px;padding:12px 0 0 14px;box-shadow:8px 0 14px -8px rgba(0,0,0,.7)}
#timeNow{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
#corner small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#ruler{position:relative;flex:none;width:var(--lane-w,800px);height:var(--ruler-h);cursor:ew-resize;touch-action:none;
  background:linear-gradient(180deg,#1f1e2e,#171622);box-shadow:0 6px 12px -6px rgba(0,0,0,.7)}
#rulerSvg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#rulerSvg text{font:500 12px var(--font);fill:#d2d5f0}
#phHead{position:absolute;left:0;top:0;width:30px;height:34px;margin-left:-15px;pointer-events:none;z-index:3;
  filter:drop-shadow(0 0 7px rgba(111,220,255,.7));will-change:transform}
#phLine{position:absolute;left:0;top:var(--ruler-h);bottom:0;width:3px;margin-left:-1.5px;border-radius:2px;z-index:6;
  background:linear-gradient(180deg,var(--cyan),#53c4ee);box-shadow:0 0 12px rgba(111,220,255,.55);pointer-events:none;will-change:transform}

/* ---------- Rows ---------- */
.row{display:flex;height:48px}
.row.bone{height:56px}
.lbl{position:sticky;left:0;z-index:10;flex:none;width:var(--label-w);display:flex;align-items:center;gap:6px;
  padding:0 8px;background:var(--label);font-size:15.5px;font-weight:500;cursor:pointer;
  box-shadow:8px 0 14px -8px rgba(0,0,0,.7)}
.row.bone .lbl{padding:0 6px 0 4px;gap:2px;font-size:15px}
.pillbg{display:flex;align-items:center;gap:6px;min-width:0;padding:4px 6px;border-radius:14px;transition:background .15s}
.row.bone.sel .pillbg{background:rgba(255,255,255,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.folder{width:26px;height:24px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw{position:relative;margin-left:auto;flex:none;width:20px;height:28px;padding:0;border:0;background:none;
  display:grid;place-items:center;font-size:19px;font-weight:500;line-height:1;color:#c9cdee;transition:color .15s,transform .12s}
.tw::after{content:"";position:absolute;inset:-8px -6px}
.tw:active{transform:scale(.8);color:#fff}
.row.ch .lbl{padding-left:16px}
.row.ch .txt{padding:5px 13px;border-radius:12px;transition:background .15s;font-size:15px}
.row.ch.sel .txt{background:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.lane{position:relative;flex:none;width:var(--lane-w,800px);background:var(--lane)}
.row.ch .lane::before{content:"";position:absolute;left:0;right:0;top:6px;bottom:6px;
  background:linear-gradient(180deg,#524d66,#454158);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -2px 6px rgba(0,0,0,.22)}
.row.ch.sel .lane::before{background:linear-gradient(180deg,#59628a,#4a5378)}
.row .lane::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.055) 0 1px,transparent 1px calc(var(--pps,200) * .25px));background-position-x:var(--pad)}

/* collapsible group */
.chs{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease-out)}
.grp.open .chs{grid-template-rows:1fr}
.chs-in{min-height:0;overflow:clip}
@supports not (overflow:clip){.chs{display:none;transition:none}.grp.open .chs{display:block}}

/* axis row */
.row.axis{height:0;opacity:0;overflow:clip;transition:height .28s var(--ease-out),opacity .2s}
.row.axis.open{height:44px;opacity:1}
.row.axis .lbl{cursor:default;align-items:center}
.axbtns{display:flex;gap:6px;padding-left:10px}
.axbtn{width:36px;height:30px;padding:0;border-radius:10px;border:1.5px solid transparent;font-size:14px;font-weight:600;
  background:#0d0c14;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 4px rgba(0,0,0,.4);
  transform:translateY(-22px);opacity:0;transition:transform .32s var(--ease-out),opacity .2s,border-color .15s,background .15s}
.row.axis.open .axbtn{transform:none;opacity:1}
.row.axis.open .axbtn:nth-child(2){transition-delay:.05s}
.row.axis.open .axbtn:nth-child(3){transition-delay:.1s}
.axbtn[data-a="x"]{color:var(--ax-x)} .axbtn[data-a="y"]{color:var(--ax-y)} .axbtn[data-a="z"]{color:var(--ax-z)} .axbtn[data-a="xz"]{color:var(--ax-xz)}
.axbtn.on{border-color:currentColor;background:#1a1930;box-shadow:0 0 12px -2px currentColor,inset 0 1px 0 rgba(255,255,255,.1)}

/* ---------- Keyframes ---------- */
.kf{position:absolute;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;padding:0;border:0;background:none;
  display:grid;place-items:center;color:#fff;touch-action:none;cursor:grab;z-index:2}
.kf .g{width:24px;height:24px;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));transition:transform .14s var(--ease-out),filter .14s}
.kf.st-red{color:var(--red)} .kf.st-yellow{color:var(--yellow)} .kf.st-orange{color:var(--orange)}
.kf.sel{color:var(--cyan);z-index:3}
.kf.sel .g{transform:scale(1.14);filter:drop-shadow(0 0 7px rgba(111,220,255,.85))}
.kf.dragging{cursor:grabbing;z-index:4}
.kf.dragging .g{transform:scale(1.28)}
.kf.mini{width:20px;height:20px;margin:-10px 0 0 -10px;pointer-events:none;opacity:.8}
.kf.mini .g{width:12px;height:12px;filter:none}
.g .full{fill:currentColor;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}
.g .ol{fill:currentColor;fill-opacity:.14;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.g .half{fill:currentColor;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}

/* ---------- Popovers ---------- */
.pop{position:fixed;z-index:80;display:none;background:linear-gradient(180deg,#3c4060,#30334e);border-radius:18px;padding:12px;
  border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1)}
.pop.show{display:block;animation:popIn .18s var(--ease-out)}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
.pop h3{margin:2px 4px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.pop h3 b{color:#fff;font-weight:600}

#easePop{width:min(372px,calc(100vw - 16px));overflow:auto;overscroll-behavior:contain}
.ease-head{display:grid;grid-template-columns:72px 1fr 1fr 1fr;gap:6px;padding:0 2px 4px;font-size:11.5px;color:var(--muted);text-align:center}
.ease-row{display:grid;grid-template-columns:72px 1fr 1fr 1fr;gap:6px;margin-bottom:6px;align-items:stretch}
.ease-fam{display:flex;align-items:center;font-size:12.5px;font-weight:500;padding-left:4px}
.ec{height:42px;padding:0 6px;border:1.5px solid transparent;border-radius:11px;background:#262840;display:flex;align-items:center;justify-content:center;gap:6px;
  color:#fff;transition:background .12s,border-color .12s,transform .1s}
.ec:active{transform:scale(.94)}
.ec .gl{width:17px;height:17px;display:inline-flex;color:#cfd3f5}
.ec .gl svg{width:17px;height:17px}
.ec .cv{width:36px;height:22px}
.ec .cv path{fill:none;stroke:#9fa6d6;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ec.on{border-color:var(--cyan);background:#2c3b57}
.ec.on .gl{color:var(--cyan)} .ec.on .cv path{stroke:var(--cyan)}
.ec.wide{grid-column:2 / span 3}

#snapPop{width:min(300px,calc(100vw - 16px))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip-btn{height:34px;min-width:44px;padding:0 12px;border:0;border-radius:999px;background:#262840;font-size:14px;font-weight:500;transition:background .12s}
.chip-btn.on{background:var(--cyan);color:#10202a;font-weight:600}
.stepper{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.stepper button{width:40px;height:40px;border:0;border-radius:12px;background:#262840;font-size:20px;line-height:1}
.stepper input{flex:1;min-width:0;height:40px;border-radius:12px;border:1.5px solid transparent;background:#12111c;color:#fff;text-align:center;font-size:17px;font-weight:600}
.stepper input:focus{border-color:var(--cyan)}
.hint{margin:0 4px 12px;font-size:12px;color:var(--muted);line-height:1.5}
.zoom{display:flex;align-items:center;gap:10px;padding:0 4px}
.zoom span{font-size:12px;color:var(--muted);width:40px}
.zoom input{flex:1;accent-color:var(--cyan)}

#keyPop{width:min(250px,calc(100vw - 16px))}
.kp-fields{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.kp-f{display:flex;align-items:center;gap:10px}
.kp-f label{width:34px;height:34px;border-radius:10px;background:#0d0c14;display:grid;place-items:center;font-weight:600;font-size:14px}
.kp-f[data-a="x"] label{color:var(--ax-x)} .kp-f[data-a="y"] label{color:var(--ax-y)} .kp-f[data-a="z"] label{color:var(--ax-z)} .kp-f[data-a="xz"] label{color:var(--ax-xz)}
.kp-f input{flex:1;min-width:0;height:36px;border-radius:11px;border:1.5px solid transparent;background:#12111c;color:#fff;padding:0 12px;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.kp-f input:focus{border-color:var(--cyan)}
.kp-f em{font-style:normal;width:16px;font-size:12px;color:var(--muted)}
.btn-del{width:100%;height:40px;border:0;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:rgba(255,93,98,.16);color:#ff8a8e;font-weight:600;font-size:14px;transition:background .12s,transform .1s}
.btn-del:active{transform:scale(.97);background:rgba(255,93,98,.3)}

/* ---------- Sheets ---------- */
.overlay{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(9,9,16,.58);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.overlay.show{display:flex}
.sheet{width:min(580px,100%);max-height:90dvh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  border-radius:24px 24px 0 0;background:linear-gradient(180deg,#383b58,#2a2c44);box-shadow:0 -20px 54px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);
  animation:sheetIn .3s var(--ease-out)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:24px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet h2{margin:0;font-size:19px;font-weight:600}
.sheet p{margin:0 0 14px;font-size:13.5px;color:var(--muted);line-height:1.55}
.x{width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.1);font-size:20px;line-height:1;display:grid;place-items:center}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sw{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:999px;background:#23243a;font-size:13.5px;cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw .tr{width:34px;height:20px;border-radius:20px;background:#4a4f78;position:relative;transition:background .18s;flex:none}
.sw .tr::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s var(--ease-out)}
.sw input:checked + .tr{background:var(--cyan)}
.sw input:checked + .tr::after{transform:translateX(14px);background:#10202a}
.sw input:focus-visible + .tr{outline:2px solid #fff;outline-offset:2px}
textarea.code{width:100%;height:170px;resize:vertical;padding:12px 14px;border-radius:14px;border:1.5px solid transparent;
  background:#12111c;color:#9ff0b0;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
textarea.code:focus{border-color:var(--cyan)}
.meta{margin:8px 2px 14px;font-size:12px;color:var(--muted)}
.actions{display:flex;gap:10px;justify-content:flex-end}
.btn{height:44px;padding:0 22px;border:0;border-radius:14px;font-size:15px;font-weight:600;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,#7ee3ff,#4fc3ee);color:#0d2230;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px rgba(79,195,238,.3)}
.btn.ghost{background:rgba(255,255,255,.1)}
.btn.danger{background:linear-gradient(180deg,#ff7b80,#ee4a50);color:#fff}
.err{display:none;margin:8px 2px 0;font-size:12.5px;color:#ff8a8e}
.skin-row{display:flex;gap:16px;align-items:center;margin-bottom:16px}
#skinThumb{width:72px;height:72px;border-radius:16px;image-rendering:pixelated;background:#12111c;border:2px solid rgba(255,255,255,.12);flex:none}
.skin-btns{display:flex;flex-direction:column;gap:8px;flex:1}
.skin-btns .btn{height:40px;font-size:14px}

@media (max-width:420px){
  :root{--label-w:140px}
  #titlebar{padding:16px 6px 0;gap:2px}
  .ib{width:38px}
  .pill{padding:0 12px;font-size:15.5px}
  #btnEase .gl{display:none}
  #btnEase .nm{max-width:112px}
  .row.bone .lbl{font-size:14.5px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="kcL"><rect x="0" y="0" width="10" height="20"/></clipPath>
    <clipPath id="kcR"><rect x="10" y="0" width="10" height="20"/></clipPath>
  </defs>
</svg>

<div id="app">
  <main id="stage">
    <div class="chip" id="chip"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <section id="tl" aria-label="Animation timeline">
    <div id="grip" title="Drag to resize"></div>

    <header id="titlebar">
      <div class="tb-l">
        <button class="ib" id="btnAdd" aria-label="Add keyframe at playhead" title="Add keyframe at playhead">
          <svg viewBox="0 0 32 32"><path d="M13 3h6a2 2 0 0 1 2 2v6h6a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-6v6a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-6H5a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h6V5a2 2 0 0 1 2-2z" fill="#fff" stroke="#8d96c8" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <button class="ib" id="btnExpr" aria-label="Stop expression" title="Stop expression">

<script>
'use strict';
/* =====================================================================
   CORE — easing, bone/channel definitions, keyframe data model,
   pose evaluation, Stop_Expression export + import.
   (No DOM / THREE access in this section.)
   ===================================================================== */

/* ---------- Easing ---------- */
const EASES = [
  'lerp',
  'ease_in_sine','ease_out_sine','ease_in_out_sine',
  'ease_in_quad','ease_out_quad','ease_in_out_quad',
  'ease_in_cubic','ease_out_cubic','ease_in_out_cubic',
  'ease_in_quart','ease_out_quart','ease_in_out_quart',
  'ease_in_quint','ease_out_quint','ease_in_out_quint',
  'ease_in_expo','ease_out_expo','ease_in_out_expo',
  'ease_in_circ','ease_out_circ','ease_in_out_circ',
  'ease_in_back','ease_out_back','ease_in_out_back',
  'ease_in_elastic','ease_out_elastic','ease_in_out_elastic',
  'ease_in_bounce','ease_out_bounce','ease_in_out_bounce'
];
const EASE_FAMILIES = ['sine','quad','cubic','quart','quint','expo','circ','back','elastic','bounce'];

function bounceOut(t) {
  const n1 = 7.5625, d1 = 2.75;
  if (t < 1 / d1) return n1 * t * t;
  if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
  if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
  return n1 * (t -= 2.625 / d1) * t + 0.984375;
}
const C1 = 1.70158, C2 = C1 * 1.525, C3 = C1 + 1, C4 = (2 * Math.PI) / 3, C5 = (2 * Math.PI) / 4.5;
const EASE_FN = {
  lerp: t => t,
  ease_in_sine: t => 1 - Math.cos((t * Math.PI) / 2),
  ease_out_sine: t => Math.sin((t * Math.PI) / 2),
  ease_in_out_sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  ease_in_quad: t => t * t,
  ease_out_quad: t => 1 - (1 - t) * (1 - t),
  ease_in_out_quad: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  ease_in_cubic: t => t * t * t,
  ease_out_cubic: t => 1 - Math.pow(1 - t, 3),
  ease_in_out_cubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  ease_in_quart: t => t * t * t * t,
  ease_out_quart: t => 1 - Math.pow(1 - t, 4),
  ease_in_out_quart: t => t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2,
  ease_in_quint: t => t * t * t * t * t,
  ease_out_quint: t => 1 - Math.pow(1 - t, 5),
  ease_in_out_quint: t => t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2,
  ease_in_expo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
  ease_out_expo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  ease_in_out_expo: t => t === 0 ? 0 : t === 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  ease_in_circ: t => 1 - Math.sqrt(1 - Math.pow(t, 2)),
  ease_out_circ: t => Math.sqrt(1 - Math.pow(t - 1, 2)),
  ease_in_out_circ: t => t < 0.5 ? (1 - Math.sqrt(1 - Math.pow(2 * t, 2))) / 2 : (Math.sqrt(1 - Math.pow(-2 * t + 2, 2)) + 1) / 2,
  ease_in_back: t => C3 * t * t * t - C1 * t * t,
  ease_out_back: t => 1 + C3 * Math.pow(t - 1, 3) + C1 * Math.pow(t - 1, 2),
  ease_in_out_back: t => t < 0.5
    ? (Math.pow(2 * t, 2) * ((C2 + 1) * 2 * t - C2)) / 2
    : (Math.pow(2 * t - 2, 2) * ((C2 + 1) * (t * 2 - 2) + C2) + 2) / 2,
  ease_in_elastic: t => t === 0 ? 0 : t === 1 ? 1 : -Math.pow(2, 10 * t - 10) * Math.sin((t * 10 - 10.75) * C4),
  ease_out_elastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * C4) + 1,
  ease_in_out_elastic: t => t === 0 ? 0 : t === 1 ? 1 : t < 0.5
    ? -(Math.pow(2, 20 * t - 10) * Math.sin((20 * t - 11.125) * C5)) / 2
    : (Math.pow(2, -20 * t + 10) * Math.sin((20 * t - 11.125) * C5)) / 2 + 1,
  ease_in_bounce: t => 1 - bounceOut(1 - t),
  ease_out_bounce: t => bounceOut(t),
  ease_in_out_bounce: t => t < 0.5 ? (1 - bounceOut(1 - 2 * t)) / 2 : (1 + bounceOut(2 * t - 1)) / 2
};
function getEase(name, t) {
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const fn = EASE_FN[name];
  return fn ? fn(t) : t;
}
function easeKind(e) {
  if (e === 'lerp') return 'lerp';
  if (e.startsWith('ease_in_out_')) return 'inout';
  if (e.startsWith('ease_in_')) return 'in';
  return 'out';
}
function easeName(e) {
  if (e === 'lerp') return 'Lerp';
  const m = e.match(/^ease_(in_out|in|out)_(.+)$/);
  if (!m) return e;
  const dir = { in: 'In', out: 'Out', in_out: 'In-Out' }[m[1]];
  return dir + ' ' + m[2][0].toUpperCase() + m[2].slice(1);
}

/* ---------- Bones & channels ---------- */
const CH_ORDER = ['rotate', 'translate', 'scale'];
const CH_LABEL = { rotate: 'Rotation', translate: 'Position', scale: 'Scale' };
const AXIS_LABEL = { x: 'X', y: 'Y', z: 'Z', xz: 'XZ' };

// Display order follows the reference UI: Head, Body, RightArm, LeftArm, legs, Root.
const BONES = [
  { id: 'head', name: 'Head', color: '#ee9a8c', tone: '#d4786a',
    rotate: { axes: ['x','y','z'], vars: { x: 'v.head.x', y: 'v.head.y', z: 'v.head.z' } },
    translate: { axes: ['x','y','z'], vars: { x: 'v.head.xpos', y: 'v.head.ypos', z: 'v.head.zpos' } } },
  { id: 'waist', name: 'Body', color: '#fbe88a', tone: '#e6cc5c',
    rotate: { axes: ['x','y','z'], vars: { x: 'v.body.x', y: 'v.body.y', z: 'v.body.z' } },
    translate: { axes: ['x','y'], vars: { x: 'v.body.xpos', y: 'v.body.ypos' } },
    scale: { axes: ['xz','y'], vars: { xz: 'v.body_head.xzscale', y: 'v.body_head.yscale' } } },
  { id: 'rightArm', name: 'RightArm', color: '#82c3da', tone: '#5fa5be',
    rotate: { axes: ['x','y','z'], vars: { x: 'v.rightarm.x', y: 'v.rightarm.y', z: 'v.rightarm.z' } },
    translate: { axes: ['y'], vars: { y: 'v.rightarm.ypos' } } },
  { id: 'leftArm', name: 'LeftArm', color: '#b4f2ae', tone: '#8fd98a',
    rotate: { axes: ['x','y','z'], vars: { x: 'v.leftarm.x', y: 'v.leftarm.y', z: 'v.leftarm.z' } },
    translate: { axes: ['y'], vars: { y: 'v.leftarm.ypos' } } },
  { id: 'rightLeg', name: 'RightLeg', color: '#f6b97a', tone: '#de9650',
    rotate: { axes: ['x'], vars: { x: 'v.rightleg.x' } } },
  { id: 'leftLeg', name: 'LeftLeg', color: '#c9a8f0', tone: '#a98bd8',
    rotate: { axes: ['x'], vars: { x: 'v.leftleg.x' } } },
  { id: 'root', name: 'Root', color: '#9db1ff', tone: '#7b90e6',
    rotate: { axes: ['x','z'], vars: { x: 'v.root.x', z: 'v.root.z' } },
    translate: { axes: ['x','y','z'], vars: { x: 'v.root.xpos', y: 'v.root.ypos', z: 'v.root.zpos' } } }
];
const BONE_BY_ID = {};
const VAR_META = {};
BONES.forEach(b => {
  BONE_BY_ID[b.id] = b;
  CH_ORDER.forEach(c => {
    if (!b[c]) return;
    b[c].axes.forEach(a => { VAR_META[b[c].vars[a]] = { bone: b.id, ch: c, axis: a }; });
  });
});
// Same variable order the previous tool exported in.
const EXPORT_ORDER = [
  'v.root.x','v.root.z','v.root.xpos','v.root.ypos','v.root.zpos',
  'v.body.x','v.body.y','v.body.z','v.body.xpos','v.body.ypos',
  'v.body_head.xzscale','v.body_head.yscale',
  'v.head.x','v.head.y','v.head.z','v.head.xpos','v.head.ypos','v.head.zpos',
  'v.rightleg.x','v.leftleg.x',
  'v.rightarm.x','v.rightarm.y','v.rightarm.z','v.rightarm.ypos',
  'v.leftarm.x','v.leftarm.y','v.leftarm.z','v.leftarm.ypos'
];
const ALL_VARS = EXPORT_ORDER.slice();
const SCALE_VARS = new Set(['v.body_head.xzscale', 'v.body_head.yscale']);
// Molang rotation vars whose sign is flipped relative to three.js rotation.
const INVERTED = new Set(['v.rightarm.y','v.leftarm.y','v.rightarm.z','v.leftarm.z','v.head.y','v.head.z','v.body.y','v.body.z']);
const varDefault = v => SCALE_VARS.has(v) ? 1 : 0;

/* ---------- Keyframe data model ----------
   One sorted track per Molang variable (= one axis of one channel).
   kf = { id, t, v, ease, g, split }
     ease  : easing of the motion ARRIVING at this keyframe
     g     : group id — keyframes created together share one (see groupAxes)
     split : true when this keyframe was pulled away from its group in axis mode
*/
const EPS = 5e-5;
const round4 = x => Math.round(x * 10000) / 10000;
const round2 = x => Math.round(x * 100) / 100;

const tracks = {};
ALL_VARS.forEach(v => { tracks[v] = []; });
const groupAxes = new Map();
let _uid = 1, _gid = 1;
const uid = () => _uid++;
function newGroup(axes) { const g = _gid++; groupAxes.set(g, axes.slice()); return g; }

function sortTrack(v) { tracks[v].sort((a, b) => a.t - b.t); }
function getKey(v, id) { return tracks[v].find(k => k.id === id) || null; }
function findKeyAt(v, t) { return tracks[v].find(k => Math.abs(k.t - t) < EPS) || null; }
function insertKey(v, t, val, ease, g, split) {
  const kf = { id: uid(), t: round4(t), v: val, ease: ease || 'lerp', g: g || 0, split: !!split };
  tracks[v].push(kf);
  sortTrack(v);
  return kf;
}
function deleteItems(items) {
  items.forEach(it => {
    const arr = tracks[it.v];
    const i = arr.findIndex(k => k.id === it.id);
    if (i >= 0) arr.splice(i, 1);
  });
}
function clearAllTracks() {
  ALL_VARS.forEach(v => { tracks[v].length = 0; });
  groupAxes.clear();
}

function evalKeys(keys, t, def) {
  const n = keys.length;
  if (!n) return def;
  if (t < keys[0].t - 1e-9) return def;           // before the first keyframe nothing is written
  let i = n - 1;
  while (i > 0 && keys[i].t > t + 1e-9) i--;
  if (i === n - 1) return keys[i].v;
  const a = keys[i], b = keys[i + 1];
  const p = (t - a.t) / (b.t - a.t);
  return a.v + (b.v - a.v) * getEase(b.ease, p);
}
const evalVar = (v, t) => evalKeys(tracks[v], t, varDefault(v));

function maxKeyTime() {
  let m = 0;
  ALL_VARS.forEach(v => { const k = tracks[v]; if (k.length && k[k.length - 1].t > m) m = k[k.length - 1].t; });
  return m;
}

/* ---------- Channel groups (combined view) ---------- */
function channelGroups(boneId, chId) {
  const ch = BONE_BY_ID[boneId][chId];
  const buckets = [];
  ch.axes.forEach(axis => {
    const v = ch.vars[axis];
    tracks[v].forEach(kf => {
      let b = buckets.find(x => Math.abs(x.t - kf.t) < EPS);
      if (!b) { b = { t: kf.t, items: [] }; buckets.push(b); }
      b.items.push({ v, axis, id: kf.id, kf });
    });
  });
  buckets.sort((a, b) => a.t - b.t);
  buckets.forEach(b => {
    b.status = groupStatus(b.items, ch.axes.length);
    b.ease = b.items[0].kf.ease;
    b.mixed = b.items.some(i => i.kf.ease !== b.ease);
  });
  return buckets;
}
function countByGroup(items) {
  const cnt = new Map();
  items.forEach(i => cnt.set(i.kf.g, (cnt.get(i.kf.g) || 0) + 1));
  return cnt;
}
// 'full' | 'ok'  -> normal   |  'red' -> pulled-away keyframe
// 'yellow' -> lost 1 axis    |  'orange' -> lost 2 axes
function groupStatus(items, n) {
  if (items.length >= n) return 'full';
  if (items.some(i => i.kf.split)) return 'red';
  let lost = 0;
  countByGroup(items).forEach((c, g) => {
    const a0 = groupAxes.get(g);
    if (a0) lost += Math.max(0, a0.length - c);
  });
  return lost === 0 ? 'ok' : lost === 1 ? 'yellow' : 'orange';
}
// A bucket that has every axis again becomes one clean group (no colour). Partial buckets
// keep their flags: red = pulled away, yellow/orange = lost axes (see groupStatus).
function normalizeChannel(boneId, chId) {
  const ch = BONE_BY_ID[boneId][chId];
  if (!ch) return;
  channelGroups(boneId, chId).forEach(b => {
    if (b.items.length < ch.axes.length) return;
    const gs = new Set(b.items.map(i => i.kf.g));
    const a0 = gs.size === 1 ? groupAxes.get([...gs][0]) : null;
    const clean = a0 && a0.length === ch.axes.length && !b.items.some(i => i.kf.split);
    if (!clean) {
      const g = newGroup(ch.axes.slice());
      b.items.forEach(i => { i.kf.g = g; i.kf.split = false; });
    }
  });
}
function normalizeAll() {
  BONES.forEach(b => CH_ORDER.forEach(c => { if (b[c]) normalizeChannel(b.id, c); }));
}
// After import / reset: one group per (channel, time) holding exactly the axes present.
function rebuildGroups() {
  groupAxes.clear();
  BONES.forEach(b => CH_ORDER.forEach(c => {
    if (!b[c]) return;
    channelGroups(b.id, c).forEach(bk => {
      const g = newGroup(bk.items.map(i => i.axis));
      bk.items.forEach(i => { i.kf.g = g; i.kf.split = false; });
    });
  }));
}

/* ---------- Editing operations ---------- */
// Create keyframes for every listed axis that has none at time t.
// opts.vals  : { var: value } used as the starting value (defaults to the evaluated value)
// opts.ease  : easing for the new keys
// opts.split : true when the new keys cover fewer axes than the channel (axis mode)
function ensureKeys(boneId, chId, axes, t, opts) {
  opts = opts || {};
  const ch = BONE_BY_ID[boneId][chId];
  t = round4(t);
  const need = axes.filter(a => !findKeyAt(ch.vars[a], t));
  if (!need.length) return [];
  const g = newGroup(need);
  const split = !!opts.split && need.length < ch.axes.length;
  return need.map(a => {
    const v = ch.vars[a];
    const val = opts.vals && opts.vals[v] !== undefined ? opts.vals[v] : round2(evalVar(v, t));
    return insertKey(v, t, val, opts.ease || 'lerp', g, split);
  });
}
function canMoveItems(items, newT) {
  const ids = new Set(items.map(i => i.id));
  return items.every(it => !tracks[it.v].some(k => !ids.has(k.id) && Math.abs(k.t - newT) < EPS));
}
function moveItems(items, newT) {
  items.forEach(it => { const k = getKey(it.v, it.id); if (k) { k.t = round4(newT); sortTrack(it.v); } });
}

/* ---------- Pose evaluation (+ arm/leg mirroring) ---------- */
const ARM_MIRROR = [
  ['v.rightarm.x', 'v.leftarm.x', 1], ['v.rightarm.y', 'v.leftarm.y', -1],
  ['v.rightarm.z', 'v.leftarm.z', -1], ['v.rightarm.ypos', 'v.leftarm.ypos', 1]
];
const LEG_MIRROR = [['v.rightleg.x', 'v.leftleg.x', 1]];
const options = { mirrorArms: true, mirrorLegs: false, riding: false };

let _activeCache = null, _dataVersion = 0;
function invalidate() { _dataVersion++; _activeCache = null; }
// A variable is "active" when it actually produces output (not just default-valued keyframes).
function activeVars() {

function createMinecraftBoxGeometry(size, uvOffset, inflate = 0, mirror = false) {

      [u + d, v + d, w, h], [u + d + w + d, v + d, w, h]

  } else {
    faces = [
      [u, v + d, d, h], [u + d + w, v + d, d, h],
      [u + d + w, v, -w, d], [u + d + w + w, v, -w, d],
      [u + d + w, v + d, -w, h], [u + d + w + d + w, v + d, -w, h]

/* ---------- Layout + ruler ---------- */
function layout(force) {

  renderMarkers();
  setPlayheadUI(curT());
  scroller.scrollLeft = Math.max(0, PAD + tAnchor * pps - (ax - r.left - lw));
  const z = $('#zoomIn');
  if (z) z.value = pps;
}
function openSnapPop() {
  const pop = $('#snapPop');
  pop.innerHTML = `<h3 id="snapTitle"></h3><div class="chips">${[10, 12, 20, 24, 30, 60].map(n => `<button class="chip-btn" data-snap="${n}">${n}</button>`).join('')}</div>
    <div class="stepper"><button data-step="-1" aria-label="Fewer steps">\u2212</button><input type="number" id="snapIn" min="1" max="120" inputmode="numeric" aria-label="Steps per second"><button data-step="1" aria-label="More steps">+</button></div>
    <p class="hint" id="snapHint"></p>
    <div class="zoom"><span>Zoom</span><input type="range" id="zoomIn" min="50" max="900" value="${Math.round(pps)}" aria-label="Timeline zoom"></div>`;
  closePops();
  refreshSnapPop();
  placePop(pop, $('#btnSnap').getBoundingClientRect(), 'right');
  $('#btnSnap').setAttribute('aria-expanded', 'true');
}
function refreshSnapPop() {
  const pop = $('#snapPop');
  if (!pop.classList.contains('show') && !$('#snapTitle')) return;
  const t = $('#snapTitle'); if (!t) return;
  t.innerHTML = `Snapping \u00b7 <b>${snap}</b> steps per second`;
  $$('.chip-btn', pop).forEach(b => b.classList.toggle('on', +b.dataset.snap === snap));
  const inp = $('#snapIn'); if (inp && document.activeElement !== inp) inp.value = snap;
  $('#snapHint').textContent = `Playhead and keyframes jump in steps of ${(1 / snap).toFixed(4)} s.`;
}

/* ---------- Keyframe operations ---------- */
function afterDataChange(ctx) {
  if (ctx) normalizeChannel(ctx.bone, ctx.ch);
  invalidate();
  layout();
  renderMarkers();
}
function selectAtTime(boneId, chId, axes, t) {
  const ch = BONE_BY_ID[boneId][chId];
  const items = [];
  axes.forEach(a => { const k = findKeyAt(ch.vars[a], t); if (k) items.push({ v: ch.vars[a], id: k.id }); });
  if (!items.length) return;
  // in combined mode select the whole bucket at that time
  if (axes.length === ch.axes.length) {
    const g = channelGroups(boneId, chId).find(b => Math.abs(b.t - t) < EPS);
    if (g) { selectItems(boneId, chId, g.items); return; }
  }
  selectItems(boneId, chId, items);
}
function visibleVals(boneId, chId, t) {
  const pose = evaluatePose(t), ch = BONE_BY_ID[boneId][chId], out = {};
  ch.axes.forEach(a => { const v = ch.vars[a]; out[v] = pose[v] !== undefined ? round2(pose[v]) : varDefault(v); });
  return out;
}
function addKeyframe() {
  if (playing) { toast('Pause the animation to add a keyframe.'); return; }
  const chId = gizmoChannel();
  if (!chId) { toast('Select a bone first.'); return; }
  const ch = BONE_BY_ID[selBone][chId], axes = activeAxes(), t = ph;
  const created = ensureKeys(selBone, chId, axes, t, { vals: visibleVals(selBone, chId, t), ease: defaultEase, split: axes.length < ch.axes.length });
  if (!created.length) {
    selectAtTime(selBone, chId, axes, t);
    toast('There is already a keyframe at this time.');
    return;
  }
  afterDataChange({ bone: selBone, ch: chId });
  selectAtTime(selBone, chId, axes, t);
  expanded.add(selBone);
  refreshRows();
}
function deleteSelected() {
  if (!selItems.length || !selCtx) return false;
  const ctx = selCtx;
  deleteItems(selItems);
  selItems = []; selCtx = null;
  closePops();
  afterDataChange(ctx);
  return true;
}

// Moving the gizmo writes into the keyframe(s) at the playhead (created on demand).
tc.addEventListener('objectChange', () => {
  if (playing || !selBone) return;
  const chId = gizmoChannel();
  if (!chId) return;
  const ch = BONE_BY_ID[selBone][chId], axes = activeAxes(), t = ph;
  const read = readBoneChannel(selBone, chId);
  const created = ensureKeys(selBone, chId, axes, t, { vals: visibleVals(selBone, chId, t), ease: defaultEase, split: axes.length < ch.axes.length });
  axes.forEach(a => {
    const v = ch.vars[a], k = findKeyAt(v, t);
    if (k && Math.abs(k.v - read[v]) > 0.004) k.v = read[v];
  });
  invalidate();
  if (created.length) { normalizeChannel(selBone, chId); layout(); renderMarkers(); expanded.add(selBone); refreshRows(); }
  selectAtTime(selBone, chId, axes, t);
});

/* ---------- Keyframe drag / long-press ---------- */
let drag = null, scrub = null, edgeTimer = null, edgeX = 0, edgeCb = null;
function startEdge(cb) {
  edgeCb = cb;
  if (edgeTimer) return;
  edgeTimer = setInterval(() => {
    const r = scroller.getBoundingClientRect(), lw = labelW();
    let dx = 0;
    if (edgeX > r.right - 40) dx = Math.min(18, (edgeX - (r.right - 40)) / 2 + 4);
    else if (edgeX < r.left + lw + 30 && scroller.scrollLeft > 0) dx = -Math.min(18, ((r.left + lw + 30) - edgeX) / 2 + 4);
    if (dx) { scroller.scrollLeft += dx; if (edgeCb) edgeCb(); }
  }, 16);
}
function stopEdge() { clearInterval(edgeTimer); edgeTimer = null; edgeCb = null; }

function startKeyDrag(e, el) {
  if (e.button) return;
  closePops();
  const info = markerInfo(el);
  const d = drag = { el, info, id: e.pointerId, x0: e.clientX, sl0: scroller.scrollLeft, t0: info.t, t: info.t,
    lastX: e.clientX, moved: false, long: false, split: false, timer: 0 };
  // axis-mode key that currently shares its time with other axes → moving it is a split
  const bucket = channelGroups(info.bone, info.ch).find(g => Math.abs(g.t - info.t) < EPS);
  d.split = !!(selAxis && info.items.length === 1 && bucket && bucket.items.length > 1);
  try { el.setPointerCapture(e.pointerId); } catch (_) {}
  selectItems(info.bone, info.ch, info.items);
  d.timer = setTimeout(() => {
    if (drag === d && !d.moved) { d.long = true; if (navigator.vibrate) navigator.vibrate(12); openKeyPop(d.el); }
  }, 460);
}
function applyDrag() {
  const d = drag;
  if (!d || !d.moved) return;
  const dx = (d.lastX - d.x0) + (scroller.scrollLeft - d.sl0);
  const nt = snapT(Math.max(0, d.t0 + dx / pps));
  if (Math.abs(nt - d.t) < 1e-6) return;
  if (!canMoveItems(d.info.items, nt)) return;     // blocked by another keyframe: stay at the last free spot
  moveItems(d.info.items, nt);
  if (d.split) { d.info.items.forEach(i => { const k = getKey(i.v, i.id); if (k) k.split = true; }); d.split = false; }
  d.t = nt;
  d.el.style.left = xOf(nt) + 'px';
  d.el.dataset.t = nt;
  invalidate();
  const need = Math.max(2, Math.ceil(Math.max(maxKeyTime(), ph) + 1));
  if (need !== viewEnd) layout();
}
function endKeyDrag(e) {
  const d = drag;
  if (!d || (e && e.pointerId !== d.id)) return;
  clearTimeout(d.timer);
  stopEdge();
  drag = null;
  d.el.classList.remove('dragging');
  if (d.moved) { afterDataChange({ bone: d.info.bone, ch: d.info.ch }); selectItems(d.info.bone, d.info.ch, d.info.items); }
}
window.addEventListener('pointermove', e => {
  if (drag && e.pointerId === drag.id) {
    drag.lastX = edgeX = e.clientX;
    if (!drag.moved && Math.abs(e.clientX - drag.x0) > 6) {
      drag.moved = true;
      clearTimeout(drag.timer);
      drag.el.classList.add('dragging');
      startEdge(applyDrag);
    }
    applyDrag();
  } else if (scrub && e.pointerId === scrub.id) {
    edgeX = e.clientX; scrubTo(e.clientX);
  }
});
window.addEventListener('pointerup', e => { endKeyDrag(e); endScrub(e); });
window.addEventListener('pointercancel', e => { endKeyDrag(e); endScrub(e); });

function startScrub(e) {
  if (e.button) return;
  closePops();
  scrub = { id: e.pointerId };
  edgeX = e.clientX;
  try { rulerEl.setPointerCapture(e.pointerId); } catch (_) {}
  scrubTo(e.clientX);
  startEdge(() => scrubTo(edgeX));
}
function scrubTo(clientX) {
  const r = rulerEl.getBoundingClientRect();
  const t = snapT(Math.max(0, (clientX - r.left - PAD) / pps));
  if (playing) { playT = t; playOrigin = t; }
  ph = t;
  if (!playing) layout();
  setPlayheadUI(curT());
}
function endScrub(e) {
  if (!scrub || (e && e.pointerId !== scrub.id)) return;
  scrub = null; stopEdge();
}

/* ----- Keyframe value popover (long-press) ----- */
const trashSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg>';
function openKeyPop(el) {
  const info = markerInfo(el), pop = $('#keyPop');
  const b = BONE_BY_ID[info.bone], ch = b[info.ch];
  const items = info.items.slice().sort((p, q) => ch.axes.indexOf(VAR_META[p.v].axis) - ch.axes.indexOf(VAR_META[q.v].axis));
  const unit = info.ch === 'rotate' ? '\u00b0' : info.ch === 'scale' ? '\u00d7' : '';
  if (!playing) { ph = info.t; layout(); setPlayheadUI(ph); }
  pop.innerHTML = `<h3><b>${b.name}</b> \u00b7 ${CH_LABEL[info.ch]} \u00b7 ${fmtT(info.t)} s</h3><div class="kp-fields">` +
    items.map(it => {
      const a = VAR_META[it.v].axis, k = getKey(it.v, it.id);
      return `<div class="kp-f" data-a="${a}"><label>${AXIS_LABEL[a]}</label><input type="number" step="any" inputmode="decimal" data-v="${it.v}" data-id="${it.id}" value="${k ? k.v : 0}" aria-label="${CH_LABEL[info.ch]} ${AXIS_LABEL[a]}"><em>${unit}</em></div>`;
    }).join('') + `</div><button class="btn-del" id="kpDel">${trashSvg}Delete keyframe</button>`;
  closePops();
  placePop(pop, el.getBoundingClientRect(), 'center');
}
$('#keyPop').addEventListener('input', e => {
  const inp = e.target.closest('input[data-v]');
  if (!inp) return;
  const k = getKey(inp.dataset.v, +inp.dataset.id), n = parseFloat(inp.value);
  if (!k || isNaN(n)) return;
  k.v = n;
  invalidate();
});
$('#keyPop').addEventListener('click', e => { if (e.target.closest('#kpDel')) deleteSelected(); });

/* ---------- Timeline events ---------- */
scroller.addEventListener('pointerdown', e => {
  const kf = e.target.closest('.kf');
  if (kf && !kf.classList.contains('mini')) { startKeyDrag(e, kf); return; }
  if (e.target.closest('#ruler')) startScrub(e);
});
scroller.addEventListener('contextmenu', e => { if (e.target.closest('.kf')) e.preventDefault(); });
scroller.addEventListener('click', e => {
  if (e.target.closest('.kf')) return;
  const tw = e.target.closest('[data-act="toggle"]');
  if (tw) { onToggleBone(tw.closest('.row').dataset.bone); return; }
  const ax = e.target.closest('.axbtn');
  if (ax) { const r = ax.closest('.row'); onAxisTap(r.dataset.bone, r.dataset.ch, ax.dataset.a); return; }
  const lbl = e.target.closest('.lbl');
  if (lbl) {
    const r = lbl.closest('.row');
    if (r.classList.contains('bone')) onBoneTap(r.dataset.bone);
    else if (r.classList.contains('ch')) onChannelTap(r.dataset.bone, r.dataset.ch);
    return;
  }
  if (e.target.closest('.lane')) clearSel();
});
scroller.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) { e.preventDefault(); setPps(pps * Math.exp(-e.deltaY * 0.0025), e.clientX); }
}, { passive: false });

// two-finger pinch zoom (native one-finger scrolling stays untouched)
let pinch = null;
scroller.addEventListener('touchstart', e => {
  if (e.touches.length === 2 && !drag && !scrub) {
    const a = e.touches[0], b = e.touches[1];
    pinch = { d0: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1, pps0: pps };
    scroller.style.overflow = 'hidden';
  }
}, { passive: true });
scroller.addEventListener('touchmove', e => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  const a = e.touches[0], b = e.touches[1];
  setPps(pinch.pps0 * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pinch.d0, (a.clientX + b.clientX) / 2);
}, { passive: false });
const endPinch = e => { if (pinch && e.touches.length < 2) { pinch = null; scroller.style.overflow = ''; } };
scroller.addEventListener('touchend', endPinch);
scroller.addEventListener('touchcancel', endPinch);

/* ---------- Title bar ---------- */
$('#btnAdd').addEventListener('click', addKeyframe);
$('#btnEase').addEventListener('click', () => { if ($('#easePop').classList.contains('show')) closePops(); else openEasePop(); });
$('#btnSnap').addEventListener('click', () => { if ($('#snapPop').classList.contains('show')) closePops(); else openSnapPop(); });
$('#easePop').addEventListener('click', e => { const b = e.target.closest('.ec'); if (b) pickEase(b.dataset.e); });
$('#snapPop').addEventListener('click', e => {
  const c = e.target.closest('[data-snap]'); if (c) { setSnap(+c.dataset.snap); return; }
  const s = e.target.closest('[data-step]'); if (s) setSnap(snap + +s.dataset.step);
});
$('#snapPop').addEventListener('change', e => { if (e.target.id === 'snapIn') setSnap(+e.target.value); });
$('#snapPop').addEventListener('input', e => { if (e.target.id === 'zoomIn') setPps(+e.target.value); });

/* ---------- Play / pause ---------- */
const loopEnd = () => Math.max(maxKeyTime() + 0.25, 0.5);
function togglePlay() {
  closePops();
  if (playing) {
    playing = false;
    ph = playOrigin;                     // pause returns the playhead to where Play started
    layout();
    setPlayheadUI(ph);
    scrollToTime(ph);
  } else {
    playOrigin = ph; playT = ph; playing = true;
  }
  $('#btnPlay').classList.toggle('on', playing);
  $('#btnPlay').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  syncGizmo();
}
function scrollToTime(t) {
  const lw = labelW(), x = xOf(t), view = scroller.clientWidth - lw;
  if (x < scroller.scrollLeft || x > scroller.scrollLeft + view - 30) scroller.scrollLeft = Math.max(0, x - view * 0.25);
}
$('#btnPlay').addEventListener('click', togglePlay);

/* ---------- Stop expression sheet ---------- */
function showOverlay(id, on) { $('#' + id).classList.toggle('show', on); }
function exprView(v) {
  $('#exprMain').hidden = v !== 'main';
  $('#exprImport').hidden = v !== 'import';
  $('#exprConfirm').hidden = v !== 'confirm';
}
function refreshExpr() {
  const s = buildExpression();
  $('#exprOut').value = s;
  let segs = 0;
  EXPORT_ORDER.forEach(v => { if (statementForVar(v)) segs += segmentsOf(tracks[v]).length; });
  $('#exprMeta').textContent = s ? `${segs} segment${segs === 1 ? '' : 's'} \u00b7 ${s.length} characters` : '';
}
$('#btnExpr').addEventListener('click', () => {
  closePops();
  $('#optArms').checked = options.mirrorArms;
  $('#optLegs').checked = options.mirrorLegs;
  exprView('main'); refreshExpr();
  $('#btnCopy').textContent = 'Copy';
  showOverlay('exprOverlay', true);
});
$('#optArms').addEventListener('change', e => { options.mirrorArms = e.target.checked; invalidate(); refreshExpr(); });
$('#optLegs').addEventListener('change', e => { options.mirrorLegs = e.target.checked; invalidate(); refreshExpr(); });
$('#btnCopy').addEventListener('click', async () => {
  const text = $('#exprOut').value;
  if (!text) { toast('Nothing to copy yet.'); return; }
  try { await navigator.clipboard.writeText(text); }
  catch (_) { const ta = $('#exprOut'); ta.select(); try { document.execCommand('copy'); } catch (__) {} ta.setSelectionRange(0, 0); }
  const b = $('#btnCopy'); b.textContent = 'Copied';
  setTimeout(() => { b.textContent = 'Copy'; }, 1500);
});
let pendingImport = null;
$('#btnImport').addEventListener('click', () => { $('#importIn').value = ''; $('#importErr').style.display = 'none'; exprView('import'); });
$('#btnImportBack').addEventListener('click', () => exprView('main'));
$('#btnImportGo').addEventListener('click', () => {
  const text = $('#importIn').value.trim(), err = $('#importErr');
  const fail = m => { err.textContent = m; err.style.display = 'block'; };
  if (!text) { fail('Paste a Stop Expression first.'); return; }
  const parsed = parseStopExpression(text);
  if (!Object.keys(parsed.tracks).length) { fail('This doesn\u2019t look like a Stop Expression made by this tool. Check the code and try again.'); return; }
  err.style.display = 'none';
  pendingImport = parsed;
  exprView('confirm');
});
$('#btnConfirmBack').addEventListener('click', () => exprView('import'));
$('#btnConfirmGo').addEventListener('click', () => {
  if (!pendingImport) return;
  applyImported(pendingImport);
  Object.keys(pendingImport.tracks).forEach(v => { if (VAR_META[v]) expanded.add(VAR_META[v].bone); });
  pendingImport = null;
  selItems = []; selCtx = null;
  ph = 0;
  showOverlay('exprOverlay', false);
  layout(true);
  afterSelection();
  setPlayheadUI(0);
  scroller.scrollLeft = 0;
  toast('Animation imported.');
});

/* ---------- Skin sheet ---------- */
$('#btnSkin').addEventListener('click', () => { closePops(); $('#optRiding').checked = options.riding; showOverlay('skinOverlay', true); drawSkinThumb(); });
$('#btnUpload').addEventListener('click', () => $('#skinFile').click());
$('#skinFile').addEventListener('change', e => { loadSkinFile(e.target.files[0]); e.target.value = ''; });
$('#btnResetSkin').addEventListener('click', loadDefaultSkin);
$('#optRiding').addEventListener('change', e => { options.riding = e.target.checked; });

$$('.overlay').forEach(o => o.addEventListener('pointerdown', e => { if (e.target === o) o.classList.remove('show'); }));
$$('[data-close]').forEach(b => b.addEventListener('click', () => $$('.overlay').forEach(o => o.classList.remove('show'))));

/* ---------- Keyboard ---------- */
window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.key === 'Escape') { closePops(); $$('.overlay').forEach(o => o.classList.remove('show')); return; }
  if ($('.overlay.show')) return;
  if (e.code === 'Space' && tag !== 'button') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { if (deleteSelected()) e.preventDefault(); }
  else if (e.key === 'k' || e.key === 'K') addKeyframe();
});

/* ---------- Resizable panel ---------- */
const tlEl = $('#tl');
let panelH = 0;
function setPanelH(h) {
  panelH = clamp(h, 190, Math.max(190, window.innerHeight - 150));
  tlEl.style.height = panelH + 'px';
}
let gripDrag = null;
$('#grip').addEventListener('pointerdown', e => { gripDrag = { y0: e.clientY, h0: tlEl.offsetHeight, id: e.pointerId }; $('#grip').setPointerCapture(e.pointerId); });
$('#grip').addEventListener('pointermove', e => { if (gripDrag && e.pointerId === gripDrag.id) setPanelH(gripDrag.h0 - (e.clientY - gripDrag.y0)); });
$('#grip').addEventListener('pointerup', () => { gripDrag = null; layout(); });
$('#grip').addEventListener('click', () => {});   // makes the strip a valid touch target (no touch-adjust to nearby buttons)
window.addEventListener('resize', () => { setPanelH(panelH || tlEl.offsetHeight); layout(true); renderMarkers(); setPlayheadUI(curT()); });

/* ---------- Frame loop ---------- */
let lastNow = performance.now(), lastT = -1;
function followPlayhead() {
  const lw = labelW(), x = xOf(playT), view = scroller.clientWidth - lw;
  if (playT < 0.02) { scroller.scrollLeft = 0; return; }
  if (x > scroller.scrollLeft + view - 36) scroller.scrollLeft = x - view * 0.2;
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastNow) / 1000);
  lastNow = now;
  if (playing) {
    playT += dt;
    if (playT >= loopEnd()) { playT = 0; }
    followPlayhead();
  }
  const t = curT();
  if (t !== lastT) { setPlayheadUI(t); lastT = t; }
  poseModel(evaluatePose(t));
  orbit.update();
  renderer.render(scene, camera);
}

/* ---------- Boot ---------- */
buildEasePop();
loadDefaultData();
buildRows();
setPanelH(Math.round(window.innerHeight * 0.46));
layout(true);
afterSelection();
setPlayheadUI(0);
loadDefaultSkin();
requestAnimationFrame(frame);


</script>
