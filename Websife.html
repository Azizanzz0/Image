<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Animator Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root{--bg:#111827;--surface2:#263449;--panel:#0d1522;--text:#e8f0ff;--primary:#9b8cff;--danger:#ff7e9d;--border:rgba(157,177,211,.19);--cv-h:340px}
*{box-sizing:border-box}
body{margin:0;padding:18px;height:100vh;height:100dvh;display:flex;gap:18px;overflow:hidden;color:var(--text);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:radial-gradient(ellipse at 10% 0%,rgba(105,184,255,.13),transparent 32%),radial-gradient(ellipse at 95% 88%,rgba(155,140,255,.14),transparent 35%),linear-gradient(145deg,#0e1521,#151e2c 52%,#101725)}
h1,h2{margin:0;font-size:18px}
h1{margin-bottom:12px}
h1 span{color:#a99cff}
.left-panel,.right-panel{min-width:0;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#485a78 transparent}
.left-panel{flex:1;padding-right:8px}
.right-panel{width:min(470px,43vw);display:flex;flex-direction:column;gap:15px;padding-right:2px}

.card{margin-bottom:15px;padding:15px;border:1px solid var(--border);border-radius:15px;background:linear-gradient(145deg,rgba(34,47,66,.96),rgba(24,34,49,.97));box-shadow:0 14px 34px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.035)}
.right-panel .card{margin-bottom:0}
.bone-card{border-left:3px solid #8b83ff}
.segment{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:10px;padding:10px;background:var(--surface2);border:1px solid rgba(160,184,220,.09);border-radius:10px}
.form-group{display:flex;flex-direction:column;min-width:80px}
.start-group{position:relative}
.form-group label{margin-bottom:4px;font-size:11px;color:#bac2de}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.toggle-group{display:flex;flex-wrap:wrap;align-items:center;gap:15px}
.toggle-label{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;user-select:none}
.toggle-label input{width:16px;height:16px;cursor:pointer}

input,select,textarea{padding:6px;color:var(--text);font-size:13px;background:#111b2a;border:1px solid rgba(151,174,210,.22);border-radius:8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(155,140,255,.12)}
textarea{width:100%;height:130px;padding:10px;font-family:monospace;resize:vertical}
button{display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border:0;border-radius:9px;cursor:pointer;font-size:13px;font-weight:bold;color:#111827;background:linear-gradient(135deg,#9d8cff,#6c9eff);box-shadow:0 4px 12px rgba(93,117,216,.13);transition:filter .2s,transform .2s}
button:hover{filter:brightness(1.09);transform:translateY(-1px)}
button:active{transform:none}
button:disabled{opacity:.3;cursor:not-allowed;pointer-events:none}
button.danger{padding:6px 10px;color:#28111c;background:linear-gradient(135deg,#ff9ab0,#ec789d)}
.error-msg{position:absolute;top:100%;left:0;margin-top:3px;font-size:10px;font-weight:bold;white-space:nowrap;color:var(--danger);opacity:0;transition:opacity .3s;pointer-events:none}
.error-msg.show{opacity:1}
#fileUpload{display:none}
.expr{flex:1;display:flex;flex-direction:column;min-height:200px}
.expr textarea{flex:1}

.viewport-card{container-type:inline-size}
.viewport-heading{margin-bottom:12px}
.viewport-heading h2{font-size:19px;letter-spacing:-.02em}
.view-tabs{display:flex;gap:4px;padding:3px;background:var(--bg);border:1px solid rgba(161,180,214,.12);border-radius:10px}
.view-tab{padding:6px 10px;font-size:12px;color:var(--text);background:transparent;box-shadow:none;opacity:.65}
.view-tab:hover{opacity:1}
.view-tab.active,.mode-btn.active{color:#111827;background:linear-gradient(135deg,#9c8dff,#6baeff);opacity:1}
.axis-editor-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.axis-editor-layout>*{min-width:0}
#canvas-container{position:relative;min-height:var(--cv-h);overflow:hidden;background:radial-gradient(ellipse at center,#1c2a3f 0%,#0d1522 72%);border:1px solid rgba(147,174,220,.2);border-radius:13px}
#canvas-container>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#canvas-container>.gizmo{z-index:1;pointer-events:auto;touch-action:none}
.fs-btn{position:absolute;right:14px;bottom:14px;z-index:2;width:42px;height:42px;padding:0;font-size:22px;color:#f2f4ff;background:linear-gradient(135deg,rgba(139,119,255,.96),rgba(69,164,255,.96));border:1px solid rgba(255,255,255,.24);border-radius:13px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
[data-mode=preview] #axisControls,[data-mode=axis] #previewControls{display:none}

.axis-sidebar{display:flex;flex-direction:column;gap:12px;padding:13px;background:rgba(11,18,30,.52);border:1px solid rgba(157,177,211,.13);border-radius:12px}
.bone-picker{gap:5px}
.bone-picker label{margin:0;font-size:10px;font-weight:800;letter-spacing:.1em;color:#95a9c8}
.bone-picker select{width:100%;padding:9px 10px}
.axis-mode-toggle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.mode-btn{padding:8px 4px;font-size:11px;color:var(--text);background:var(--surface2);box-shadow:none;border-radius:8px;opacity:.7}
.axis-readout{padding:12px;background:rgba(10,17,29,.58);border:1px solid rgba(157,177,211,.12);border-radius:11px}
.readout-group+.readout-group{margin-top:8px;padding-top:8px;border-top:1px solid rgba(154,177,213,.1)}
.group-label{display:block;margin-bottom:4px;font-size:11px;color:#bac2de}
.readout-row{display:flex;gap:6px}
.readout-row .form-group{flex:1 1 0;min-width:0}
.readout-row input{width:100%;min-width:0;padding:7px}
.axis-reset-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.axis-reset-actions button{min-height:36px;padding:7px;font-size:11px}

.viewport-card.full{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;margin:0;padding:clamp(8px,1.5vw,16px);border-radius:0;background:linear-gradient(145deg,#192435,#0e1623)}
.full .axis-editor-layout{flex:1;min-height:0;grid-template-rows:minmax(0,1fr) auto}
.full[data-mode=axis] .axis-editor-layout{grid-template-rows:minmax(0,42fr) minmax(0,58fr)}
.full #canvas-container{min-height:0}
.full .axis-sidebar{overflow-y:auto}
@container (min-width:600px){
  [data-mode=axis] .axis-editor-layout{grid-template-columns:minmax(0,1fr) clamp(240px,36%,340px)}
  .full[data-mode=axis] .axis-editor-layout{grid-template-rows:minmax(0,1fr)}
}

.modal-overlay{display:none;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.6)}
.modal-box{width:100%;max-width:480px;max-height:100%;overflow-y:auto;padding:20px;background:#1c2635;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.modal-box label{display:block;margin-bottom:6px;font-size:12px;color:#bac2de}
.modal-box p{margin:8px 0 0;font-size:12px;line-height:1.4;color:#bac2de}
.modal-box textarea{height:160px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:15px}
.btn-cancel{color:var(--text);background:var(--panel);border:1px solid var(--border);box-shadow:none}
.import-error{display:none;margin-top:8px;font-size:12px;color:var(--danger)}

@media (max-height:560px){
  body{padding:10px;gap:10px}
  :root{--cv-h:clamp(170px,calc(100dvh - 160px),340px)}
  .card{padding:10px;border-radius:12px}
  .viewport-heading{margin-bottom:8px}
  .full .axis-sidebar{gap:6px;padding:8px}
  .full .axis-readout{padding:8px}
  .full .readout-group+.readout-group{margin-top:5px;padding-top:5px}
  .full .bone-picker label{display:none}
  .full .group-label{margin-bottom:2px;font-size:10px}
  .full .readout-row .form-group label{margin-bottom:1px;font-size:10px}
  .full .readout-row input{padding:3px 5px;font-size:12px}
  .full .bone-picker select{padding:6px 8px}
  .full .mode-btn,.full .axis-reset-actions button{min-height:26px;padding:3px}
}
@media (max-width:768px),(max-width:900px) and (orientation:portrait){
  :root{--cv-h:280px}
  body{flex-direction:column;height:auto;min-height:100dvh;gap:14px;padding:10px;overflow:visible}
  body.noscroll{height:100dvh;overflow:hidden}
  .left-panel{flex:none;max-height:max(60dvh,220px);padding-right:5px}
  .right-panel{width:100%;overflow:visible}
}
</style>
</head>
<body>
<div class="left-panel">
    <h1>Player Animator <span>Studio</span></h1>
    <div class="card toggle-group">
        <label class="toggle-label"><input type="checkbox" id="mirrorArms" checked onchange="generate()"> Mirror Arms</label>
        <label class="toggle-label"><input type="checkbox" id="playerRiding"> Player Riding</label>
        <label class="toggle-label"><input type="checkbox" id="mirrorLegs" onchange="generate()"> Mirror Legs</label>
    </div>
    <div id="bonesContainer"></div>
    <button onclick="addBone()" style="margin-bottom:30px;width:100%">+ Add New Bone</button>
</div>
<div class="right-panel">
    <div class="card viewport-card" id="viewportCard" data-mode="preview">
        <div class="flex-between viewport-heading">
            <h2 id="viewportTitle">3D Live Preview</h2>
            <div class="view-tabs">
                <button class="view-tab active" id="tabPreview" onclick="setViewMode('preview')">Live Preview</button>
                <button class="view-tab" id="tabAxis" onclick="setViewMode('axis')">Axis Editor</button>
            </div>
        </div>
        <div class="axis-editor-layout">
            <div id="canvas-container">
                <button class="fs-btn" id="fsBtn" onclick="toggleFullscreen()" title="Fullscreen" aria-label="Fullscreen">⛶</button>
            </div>
            <div id="previewControls"><button onclick="togglePlay()">Ⅱ / ▶ Play</button></div>
            <aside id="axisControls" class="axis-sidebar">
                <div class="form-group bone-picker">
                    <label for="boneSelect">SELECT BONE</label>
                    <select id="boneSelect" onchange="selectBone(this.value)"></select>
                </div>
                <div class="axis-mode-toggle">
                    <button class="mode-btn" data-mode="rotate" onclick="setGizmoMode('rotate')">⟳ Rotate</button>
                    <button class="mode-btn" data-mode="move" onclick="setGizmoMode('move')">✥ Move</button>
                    <button class="mode-btn" data-mode="scale" onclick="setGizmoMode('scale')">⤢ Scale</button>
                </div>
                <div id="axisReadout" class="axis-readout"></div>
                <div class="axis-reset-actions">
                    <button class="danger" onclick="resetBonePose()">Reset Bone</button>
                    <button onclick="resetAllPose()">Reset All</button>
                </div>
            </aside>
        </div>
    </div>
    <div class="card">
        <h2 style="margin-bottom:10px">Custom Skin</h2>
        <div style="display:flex;gap:10px">
            <button onclick="$('fileUpload').click()">Upload Image</button>
            <button onclick="resetSkin()">Reset Default</button>
            <input type="file" id="fileUpload" accept="image/*" onchange="uploadSkin(event)">
        </div>
    </div>
    <div class="card expr">
        <div class="flex-between" style="margin-bottom:10px">
            <h2>Stop_Expression (playanimation)</h2>
            <div style="display:flex;gap:8px">
                <button onclick="copyCode()">Copy</button>
                <button onclick="openImportModal()">Import</button>
            </div>
        </div>
        <textarea id="output" readonly></textarea>
    </div>
</div>

<div id="importOverlay" class="modal-overlay">
    <div class="modal-box">
        <div id="importPhaseInput">
            <h2>Import Stop_Expression</h2>
            <label for="importInput" style="margin-top:12px">Stop_Expression code</label>
            <textarea id="importInput" placeholder="Paste your Stop_Expression here..."></textarea>
            <div id="importError" class="import-error"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeImportModal()">Cancel</button>
                <button onclick="attemptImport()">Import</button>
            </div>
        </div>
        <div id="importPhaseConfirm" style="display:none">
            <h2>Replace all keyframes?</h2>
            <p>All current keyframes will be replaced with the imported data.</p>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="cancelImportConfirm()">Cancel</button>
                <button class="danger" onclick="confirmReplaceImport()">Replace</button>
            </div>
        </div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
const DEG = Math.PI / 180;
const r2 = v => Math.round(v * 100) / 100;
const DEFAULT_TEXTURE_URL = "https://raw.githubusercontent.com/Azizanzz0/Image/refs/heads/main/IMG_5351.png";

const boneVariables = [
    "v.root.x", "v.root.z", "v.root.xpos", "v.root.ypos", "v.root.zpos",
    "v.body.x", "v.body.y", "v.body.z", "v.body.xpos", "v.body.ypos",
    "v.body_head.xzscale", "v.body_head.yscale",
    "v.head.x", "v.head.y", "v.head.z", "v.head.xpos", "v.head.ypos", "v.head.zpos",
    "v.rightleg.x", "v.leftleg.x",
    "v.rightarm.x", "v.rightarm.y", "v.rightarm.z", "v.rightarm.ypos",
    "v.leftarm.x", "v.leftarm.y", "v.leftarm.z", "v.leftarm.ypos"
];
const invertedBones = ["v.rightarm.y", "v.leftarm.y", "v.rightarm.z", "v.leftarm.z", "v.head.y", "v.head.z", "v.body.y", "v.body.z"];

const bounceOut = t => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
    return n * (t -= 2.625 / d) * t + 0.984375;
};
const EASE_IN = {
    sine: t => 1 - Math.cos(t * Math.PI / 2),
    quad: t => t ** 2, cubic: t => t ** 3, quart: t => t ** 4, quint: t => t ** 5,
    expo: t => t ? 2 ** (10 * t - 10) : 0,
    circ: t => 1 - Math.sqrt(1 - t * t),
    back: t => 2.70158 * t ** 3 - 1.70158 * t * t,
    elastic: t => t && t < 1 ? -(2 ** (10 * t - 10)) * Math.sin((t * 10 - 10.75) * 2 * Math.PI / 3) : t,
    bounce: t => 1 - bounceOut(1 - t)
};
const EASINGS = { lerp: t => t };
for (const [n, f] of Object.entries(EASE_IN)) {
    EASINGS[`ease_in_${n}`] = f;
    EASINGS[`ease_out_${n}`] = t => 1 - f(1 - t);
    EASINGS[`ease_in_out_${n}`] = t => t < .5 ? f(2 * t) / 2 : 1 - f(2 - 2 * t) / 2;
}
const c2 = 1.70158 * 1.525, c5 = 2 * Math.PI / 4.5;
EASINGS.ease_in_out_back = t => t < .5
    ? ((2 * t) ** 2 * ((c2 + 1) * 2 * t - c2)) / 2
    : ((2 * t - 2) ** 2 * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
EASINGS.ease_in_out_elastic = t => t === 0 || t === 1 ? t : t < .5
    ? -(2 ** (20 * t - 10) * Math.sin((20 * t - 11.125) * c5)) / 2
    : (2 ** (-20 * t + 10) * Math.sin((20 * t - 11.125) * c5)) / 2 + 1;
const easeList = Object.keys(EASINGS);
const getEase = (name, t) => (EASINGS[name] || EASINGS.lerp)(Math.min(Math.max(t, 0), 1));

let data = [{ bone: 'v.rightarm.x', segments: [
    { start: 0, dur: 0.5, val1: 0, val2: -90, ease: 'ease_out_back' },
    { start: 0.5, dur: 0.5, val1: 0, val2: 0, ease: 'ease_in_out_sine' }
] }];

const trashIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#11111b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
const keyframeIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right:6px"><path d="M12 2L22 12L12 22L2 12Z"/></svg>';

function renderBones() {
    $('bonesContainer').innerHTML = data.map((bd, b) => {
        const boneOpts = boneVariables.map(v => `<option value="${v}"${bd.bone === v ? ' selected' : ''}>${v}</option>`).join('');
        const field = (label, w, attrs) => `<div class="form-group" style="width:${w}px"><label>${label}</label><input type="number" ${attrs}></div>`;
        const segs = bd.segments.map((sg, s) => {
            const easeOpts = easeList.map(e => `<option value="${e}"${sg.ease === e ? ' selected' : ''}>${e === 'lerp' ? 'lerp (linear)' : e.replace(/_/g, ' ')}</option>`).join('');
            return `<div class="segment">
                <div class="form-group" style="width:20px"><label>#${s + 1}</label></div>
                <div class="form-group start-group" style="width:55px"><label>Start</label><input type="number" step="0.1" id="start-${b}-${s}" value="${sg.start}" onchange="validateStart(${b},${s},this.value)"><span id="err-${b}-${s}" class="error-msg"></span></div>
                ${field('Dur', 55, `step="0.1" value="${sg.dur}" oninput="updateSeg(${b},${s},'dur',this.value)"`)}
                ${s ? '' : field('From', 60, `step="any" value="${sg.val1}" oninput="updateSeg(${b},${s},'val1',this.value)"`)}
                ${field('To', 60, `step="any" value="${sg.val2}" oninput="updateSeg(${b},${s},'val2',this.value)"`)}
                <div class="form-group"><label>Ease</label><select onchange="updateSeg(${b},${s},'ease',this.value)">${easeOpts}</select></div>
                <div class="form-group"><button class="danger" style="margin-top:15px" onclick="removeSeg(${b},${s})" title="Remove Keyframe">${trashIcon}</button></div>
            </div>`;
        }).join('');
        return `<div class="card bone-card"><div class="flex-between"><div class="form-group"><select onchange="updateBone(${b},this.value)" style="font-weight:bold;font-size:14px">${boneOpts}</select></div><button class="danger" onclick="removeBone(${b})" title="Remove Bone">${trashIcon}</button></div>${segs}<br><button onclick="addSeg(${b})">${keyframeIcon} Add Keyframe</button></div>`;
    }).join('');
    generate();
}

function addBone() { data.push({ bone: boneVariables[0], segments: [{ start: 0, dur: 0.5, val1: 0, val2: 45, ease: 'lerp' }] }); renderBones(); }
function removeBone(b) { data.splice(b, 1); renderBones(); }
function removeSeg(b, s) { data[b].segments.splice(s, 1); renderBones(); }
function updateBone(b, val) { data[b].bone = val; generate(); }
function updateSeg(b, s, key, val) { data[b].segments[s][key] = key === 'ease' ? val : parseFloat(val) || 0; generate(); }

function addSeg(b) {
    const segs = data[b].segments, last = getEffectiveSegments(segs).pop();
    segs.push({ start: last ? r2(last.start + last.dur) : 0, dur: 1, val1: 0, val2: 0, ease: 'ease_out_sine' });
    renderBones();
}

function validateStart(b, s, val) {
    const v = parseFloat(val) || 0, prev = data[b].segments[s - 1];
    if (prev) {
        const minEnd = r2(prev.start + prev.dur);
        if (Math.abs(v - prev.start) > 1e-6 && v < minEnd) {
            const input = $(`start-${b}-${s}`), err = $(`err-${b}-${s}`);
            input.style.color = input.style.borderColor = 'var(--danger)';
            err.textContent = `Use ${prev.start} or ≥ ${minEnd}`;
            err.classList.add('show');
            data[b].segments[s].start = minEnd;
            generate();
            setTimeout(() => {
                input.style.color = input.style.borderColor = '';
                err.classList.remove('show');
                input.value = minEnd;
            }, 2000);
            return;
        }
    }
    updateSeg(b, s, 'start', v);
}

function getEffectiveSegments(segs) {
    const seen = new Set();
    return segs.filter(s => { const k = (+s.start || 0).toFixed(6); return !seen.has(k) && seen.add(k); });
}

function interp(sg, from, to) {
    const start = +sg.start || 0, dur = Math.max(+sg.dur || 0, 1e-4);
    return `math.${sg.ease}(${from},${to},math.min(${start ? `(q.state_time-${start})` : 'q.state_time'}/${dur},1))`;
}

function buildBoneStatement(segs, name) {
    const f = getEffectiveSegments(segs), n = f.length;
    if (!n) return '';
    let expr = '';
    for (let i = n - 1; i >= 0; i--) {
        const cur = interp(f[i], i ? f[i - 1].val2 : f[0].val1, f[i].val2);
        expr = i === n - 1 ? cur : `q.state_time<${f[i + 1].start}?${cur}:${i < n - 2 ? `(${expr})` : expr}`;
    }
    const start = +f[0].start || 0;
    return start ? `q.state_time>=${start}?{${name}=${expr};};` : `${name}=${expr};`;
}

const MIRRORS = [
    ['mirrorArms', 'v.rightarm.x', 'v.leftarm.x', 1], ['mirrorArms', 'v.rightarm.y', 'v.leftarm.y', -1],
    ['mirrorArms', 'v.rightarm.z', 'v.leftarm.z', -1], ['mirrorArms', 'v.rightarm.ypos', 'v.leftarm.ypos', 1],
    ['mirrorLegs', 'v.rightleg.x', 'v.leftleg.x', 1]
];
const activeMirrors = has => MIRRORS.flatMap(([chk, r, l, sign]) =>
    !$(chk).checked || has(r) === has(l) ? [] : has(r) ? [[l, r, sign]] : [[r, l, sign]]);

function generate() {
    const used = new Set(data.map(b => b.bone));
    $('output').value = data.map(b => buildBoneStatement(b.segments, b.bone)).join('')

function splitTop(s, sep) {

}

        : '<input disabled placeholder="—">') + '</div>';
    const xyz = (sfx, on, def) => [...'xyz'].map(a => field(a.toUpperCase(), `${b.prefix}.${a}${sfx}`, on.includes(a), def)).join('');
    const group = (title, html) => `<div class="readout-group"><span class="group-label">${title}</span><div class="readout-row">${html}</div></div>`;
    $('axisReadout').innerHTML = group('ROTATION · DEG', xyz('', b.rotate, 0)) + group('POSITION', xyz('pos', b.move, 0))
        + group('SCALE', field('XZ', b.scale && SCALE_KEYS.xz, b.scale, 1) + field('Y', b.scale && SCALE_KEYS.y, b.scale, 1));
}

function syncReadout() {
    $('axisReadout').querySelectorAll('input[data-key]').forEach(i => { i.value = manualPose[i.dataset.key] ?? i.dataset.def; });
}

function setPoseValue(key, val) {
    const v = parseFloat(val);
    manualPose[key] = Number.isFinite(v) ? v : key.endsWith('scale') ? 1 : 0;
    syncReadout();
}

function updateModeButtons() {
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === gizmoMode);
        btn.disabled = !modeAxes(BONES[selectedBone], btn.dataset.mode);
    });
}

function selectBone(name) {
    if (!BONES[name]) return;
    selectedBone = name;
    $('boneSelect').value = name;
    if (!modeAxes(BONES[name], gizmoMode)) gizmoMode = 'rotate';
    updateModeButtons();
    renderAxisReadout();
}

function setGizmoMode(mode) {
    if (!modeAxes(BONES[selectedBone], mode)) return;
    gizmoMode = mode;
    updateModeButtons();
}

function resetBonePose() {
    const b = BONES[selectedBone];
    [...b.rotate].forEach(a => delete manualPose[`${b.prefix}.${a}`]);
    [...b.move].forEach(a => delete manualPose[`${b.prefix}.${a}pos`]);
    if (b.scale) Object.values(SCALE_KEYS).forEach(k => delete manualPose[k]);
    renderAxisReadout();
}

function resetAllPose() { manualPose = {}; renderAxisReadout(); }

function setViewMode(mode) {
    viewMode = viewportCard.dataset.mode = mode;
    $('tabPreview').classList.toggle('active', mode === 'preview');
    $('tabAxis').classList.toggle('active', mode === 'axis');
    $('viewportTitle').textContent = mode === 'axis' ? 'Axis Editor' : '3D Live Preview';
    hoverAxis = null;
    endDrag();
}

function setFullscreen(on) {
    viewportCard.classList.toggle('full', on);
    document.body.classList.toggle('noscroll', on);
    const btn = $('fsBtn');
    btn.textContent = on ? '⤢' : '⛶';
    btn.title = btn.ariaLabel = on ? 'Exit fullscreen' : 'Fullscreen';
}
function toggleFullscreen() { setFullscreen(!viewportCard.classList.contains('full')); }
addEventListener('keydown', e => { if (e.key === 'Escape') setFullscreen(false); });

let isPlaying = true, animTime = 0;
const clock = new THREE.Clock();
function togglePlay() { isPlaying = !isPlaying; }

function previewValues(dt) {
    if (isPlaying) animTime += dt;
    const total = Math.max(0.1, ...data.flatMap(b => b.segments.map(s => s.start + s.dur)));
    const t = animTime % total, vals = {};
    data.forEach(b => {
        let v = 0;
        getEffectiveSegments(b.segments).forEach((s, i) => {
            if (!i) v = s.val1;
            if (t >= s.start) v += (s.val2 - v) * getEase(s.ease, (t - s.start) / Math.max(s.dur, 1e-4));
        });
        vals[b.bone] = v;
    });
    activeMirrors(k => k in vals).forEach(([to, from, sign]) => vals[to] = sign * vals[from]);
    return vals;
}

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    resetBonesToBindPose();
    applyValuesToBones(viewMode === 'preview' ? previewValues(dt) : manualPose);
    controls.update();
    renderer.render(scene, camera);
    drawGizmo();
}

function resizeViewport() {
    viewW = Math.max(container.clientWidth, 1);
    viewH = Math.max(container.clientHeight, 1);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    camera.aspect = viewW / viewH;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(dpr);
    renderer.setSize(viewW, viewH, false);
    gizmoCanvas.width = Math.round(viewW * dpr);
    gizmoCanvas.height = Math.round(viewH * dpr);
    gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resizeViewport);
if (window.ResizeObserver) new ResizeObserver(resizeViewport).observe(container);

$('boneSelect').innerHTML = Object.entries(BONES).map(([k, b]) => `<option value="${k}">${b.label}</option>`).join('');
selectBone('rightArm');
renderBones();
resetSkin();
resizeViewport();
animate();
</script>
</body>
</html>
