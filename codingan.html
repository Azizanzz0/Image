<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>MoLang Animator V1.2</title> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> 
    <style> 
        :root { --bg: #36454f; --surface: #313244; --surface2: #45475a; --text: #cdd6f4; --primary: #89b4fa; --danger: #f38ba8; --border: #585b70; --success: #a6e3a1; --panel: #11111b; } 
        * { box-sizing: border-box; } 
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; gap: 20px; height: 100vh; overflow: hidden; } 
        h1, h2, h3 { margin-top: 0; font-size: 18px; }
        .left-panel { flex: 1; overflow-y: auto; padding-right: 15px; height: calc(100vh - 40px); pointer-events: auto; }
        .right-panel { width: 420px; display: flex; flex-direction: column; gap: 15px; height: calc(100vh - 40px); overflow-y: auto; padding-right: 5px; }
        .card { background: var(--surface); padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .bone-card { border-left: 5px solid var(--primary); }
        .segment { background: var(--surface2); padding: 10px; border-radius: 6px; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; min-width: 80px; }
        .form-group.start-group { position: relative; }
        .form-group label { font-size: 11px; margin-bottom: 4px; color: #bac2de; }
        input, select { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 6px; border-radius: 4px; outline: none; font-size: 13px; transition: all 0.2s; }
        input:focus, select:focus { border-color: var(--primary); }
        button { background: var(--primary); color: #11111b; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
        button:hover { opacity: 0.8; }
        button.danger { background: var(--danger); padding: 6px 10px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        
        .error-msg { color: var(--danger); font-size: 10px; position: absolute; top: 100%; left: 0; white-space: nowrap; margin-top: 3px; opacity: 0; transition: opacity 0.3s; pointer-events: none; font-weight: bold; }
        .error-msg.show { opacity: 1; }

        textarea { width: 100%; height: 130px; background: var(--panel); color: var(--success); font-family: monospace; border: 1px solid var(--border); padding: 10px; border-radius: 6px; resize: vertical; box-sizing: border-box; font-size: 13px; }
        
        #canvas-container { width: 100%; height: 320px; background: var(--panel); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); position: relative; }
        #fileUpload { display: none; }

        @media (max-width: 768px) {
            body { flex-direction: column; padding: 10px; height: auto; overflow-y: auto; gap: 15px; }
            .left-panel { width: 100%; height: auto; max-height: 60vh; padding-right: 5px; overflow-y: auto; }
            .right-panel { width: 100%; height: auto; max-height: none; overflow-y: visible; }
            #canvas-container { height: 280px; }
            .card { margin-bottom: 10px; }
        }
    </style>
</head> 
<body> 
<div class="left-panel"> 
    <h1>MoLang Animator V1.2</h1> 
    <div class="card flex-between"> 
        <label><input type="checkbox" id="mirrorArms" checked onchange="generate()"> Mirror Arms</label> 
        <label><input type="checkbox" id="mirrorLegs" onchange="generate()"> Mirror Legs</label> 
    </div> 
    <div id="bonesContainer"></div> 
    <button onclick="addBone()" style="margin-bottom: 30px; width: 100%;">+ Add New Bone</button> 
</div> 
<div class="right-panel"> 
    <div class="card" style="margin-bottom: 0;"> 
        <div class="flex-between"> 
            <h2>3D Live Preview</h2> 
            <button onclick="togglePlay()">Pause / Play</button> 
        </div> 
        <div id="canvas-container"></div> 
        <p style="font-size: 11px; color: #bac2de; margin-top: 8px; margin-bottom: 0;">Left click + drag: Rotate camera | Scroll: Zoom</p> 
    </div>

    <div class="card" style="margin-bottom: 0;">
        <h2>Custom Skin</h2>
        <div style="margin-top: 10px; display: flex; gap: 10px;">
            <button onclick="document.getElementById('fileUpload').click()">Upload Image</button>
            <button onclick="resetSkin()">Reset Default</button>
            <input type="file" id="fileUpload" accept="image/*" onchange="uploadSkin(event)">
        </div>
    </div>

    <div class="card" style="flex: 1; display: flex; flex-direction: column; margin-bottom: 0;">
        <div class="flex-between" style="margin-bottom: 10px;">
            <h2>Stop Expression (MoLang)</h2>
            <button onclick="copyCode()">Copy</button>
        </div>
        <textarea id="output" readonly style="flex: 1;"></textarea>
    </div>
</div> 

<script> 
const DEFAULT_TEXTURE_URL = "https://raw.githubusercontent.com/Azizanzz0/Image/refs/heads/main/IMG_5351.png"; 
const boneVariables = [ "v.root.x", "v.root.z", "v.body.x", "v.body.y", "v.body.z", "v.head.x", "v.head.y", "v.head.z", "v.rightleg.x", "v.leftleg.x", "v.rightarm.x", "v.rightarm.y", "v.rightarm.z", "v.rightarm.ypos", "v.leftarm.x", "v.leftarm.y", "v.leftarm.z", "v.leftarm.ypos" ]; 
const easeList = [ "lerp", "ease_in_sine", "ease_out_sine", "ease_in_out_sine", "ease_in_quad", "ease_out_quad", "ease_in_out_quad", "ease_in_cubic", "ease_out_cubic", "ease_in_out_cubic", "ease_out_back", "ease_in_out_back", "ease_out_elastic", "ease_in_out_elastic", "ease_out_bounce" ]; 
let data = [ { bone: 'v.rightarm.x', segments: [ { start: 0, dur: 0.5, val1: 0, val2: -90, ease: 'ease_out_back' }, { start: 0.5, dur: 0.5, val1: 0, val2: 0, ease: 'ease_in_out_sine' } ] } ]; 

const trashIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#11111b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
const keyframeIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 6px;"><path d="M12 2L22 12L12 22L2 12L12 2Z"/></svg>`;

function renderBones() { 
    const container = document.getElementById('bonesContainer'); 
    container.innerHTML = ''; 
    data.forEach((bData, bIndex) => { 
        let boneOptions = boneVariables.map(v => `<option value="${v}" ${bData.bone === v ? 'selected' : ''}>${v}</option>`).join(''); 
        let html = ` <div class="card bone-card"> <div class="flex-between"> <div class="form-group"> <select onchange="updateBone(${bIndex}, this.value)" style="font-weight: bold; font-size: 14px;">${boneOptions}</select> </div> <button class="danger" onclick="removeBone(${bIndex})" title="Remove Bone">${trashIcon}</button> </div> <div id="segments-${bIndex}"> `; 
        bData.segments.forEach((seg, sIndex) => { 
            let easeOptions = easeList.map(e => { 
                let label = e === 'lerp' ? 'lerp (linear)' : e.replace(/_/g, ' '); 
                return `<option value="${e}" ${seg.ease === e ? 'selected' : ''}>${label}</option>`; 
            }).join(''); 
            html += ` <div class="segment"> <div class="form-group" style="width: 20px;"><label>#${sIndex + 1}</label></div> <div class="form-group start-group" style="width: 55px;"><label>Start</label><input type="number" step="0.1" id="start-${bIndex}-${sIndex}" value="${seg.start}" onchange="validateStart(${bIndex}, ${sIndex}, this.value)"><span id="err-${bIndex}-${sIndex}" class="error-msg"></span></div> <div class="form-group" style="width: 55px;"><label>Dur</label><input type="number" step="0.1" value="${seg.dur}" oninput="updateSeg(${bIndex}, ${sIndex}, 'dur', this.value)"></div> ${sIndex === 0 ? `<div class="form-group" style="width: 60px;"><label>From</label><input type="number" value="${seg.val1}" oninput="updateSeg(${bIndex}, ${sIndex}, 'val1', this.value)"></div>` : ''} <div class="form-group" style="width: 60px;"><label>To</label><input type="number" value="${seg.val2}" oninput="updateSeg(${bIndex}, ${sIndex}, 'val2', this.value)"></div> <div class="form-group"><label>Ease</label><select onchange="updateSeg(${bIndex}, ${sIndex}, 'ease', this.value)">${easeOptions}</select></div> <div class="form-group"><button class="danger" style="margin-top: 15px;" onclick="removeSeg(${bIndex}, ${sIndex})" title="Remove Keyframe">${trashIcon}</button></div> </div> `; 
        }); 
        html += `</div><br><button onclick="addSeg(${bIndex})">${keyframeIcon} Add Keyframe</button></div>`; 
        container.innerHTML += html; 
    }); 
    generate(); 
} 

function addBone() { data.push({ bone: boneVariables[0], segments: [{ start: 0, dur: 0.5, val1: 0, val2: 45, ease: 'lerp' }] }); renderBones(); } 
function removeBone(i) { data.splice(i, 1); renderBones(); } 
function addSeg(bIndex) { 
    let segs = data[bIndex].segments; 
    let start = segs.length > 0 ? parseFloat(segs[segs.length - 1].start) + parseFloat(segs[segs.length - 1].dur) : 0; 
    segs.push({ start: Number(start.toFixed(2)), dur: 1, val1: 0, val2: 0, ease: 'ease_out_sine' }); 
    renderBones(); 
} 
function removeSeg(bIndex, sIndex) { data[bIndex].segments.splice(sIndex, 1); renderBones(); } 
function updateBone(bIndex, val) { data[bIndex].bone = val; generate(); } 
function updateSeg(bIndex, sIndex, key, val) { data[bIndex].segments[sIndex][key] = key === 'ease' ? val : parseFloat(val) || 0; generate(); } 

function validateStart(bIndex, sIndex, val) {
    let numVal = parseFloat(val) || 0;
    if (sIndex > 0) {
        let prevSeg = data[bIndex].segments[sIndex - 1];
        let minStart = Number((prevSeg.start + prevSeg.dur).toFixed(2));
        
        if (numVal < minStart) {
            let inputEl = document.getElementById(`start-${bIndex}-${sIndex}`);
            let errEl = document.getElementById(`err-${bIndex}-${sIndex}`);
            
            // Visual feedback
            inputEl.style.color = "var(--danger)";
            inputEl.style.borderColor = "var(--danger)";
            errEl.innerText = `Cannot be below ${minStart}`;
            errEl.classList.add('show');
            
            // Revert data automatically
            data[bIndex].segments[sIndex].start = minStart;
            generate(); // Update preview/code immediately
            
            // Remove error visually after 2 seconds
            setTimeout(() => {
                if(inputEl && errEl) {
                    inputEl.style.color = "";
                    inputEl.style.borderColor = "";
                    errEl.classList.remove('show');
                    inputEl.value = minStart; // Visually revert the input box
                }
            }, 2000);
            
            return; // Stop here so we don't overwrite with the invalid value
        }
    }
    updateSeg(bIndex, sIndex, 'start', numVal);
}

function generate() { 
    let mirrorArms = document.getElementById('mirrorArms').checked; 
    let mirrorLegs = document.getElementById('mirrorLegs').checked; 
    let outStr = ""; 
    let used = new Set(); 
    data.forEach(bData => { 
        used.add(bData.bone); 
        bData.segments.forEach((seg, index) => { 
            let timeExpr = seg.start === 0 ? `q.state_time` : `(q.state_time-${seg.start})`; 
            let easeFunc = seg.ease === 'lerp' ? 'lerp' : seg.ease; 
            if (index === 0) outStr += `q.state_time>=${seg.start}?{${bData.bone}=math.${easeFunc}(${seg.val1},${seg.val2},math.min(${timeExpr}/${seg.dur},1));};`; 
            else outStr += `q.state_time>=${seg.start}?{${bData.bone}=math.${easeFunc}(${bData.bone},${seg.val2},math.min(${timeExpr}/${seg.dur},1));};`; 
        }); 
    }); 
    
    // Bidirectional Mirror Logic
    if (mirrorArms) { 
        if (used.has("v.rightarm.x") && !used.has("v.leftarm.x")) outStr += `v.leftarm.x=v.rightarm.x;`; 
        else if (used.has("v.leftarm.x") && !used.has("v.rightarm.x")) outStr += `v.rightarm.x=v.leftarm.x;`; 

        if (used.has("v.rightarm.y") && !used.has("v.leftarm.y")) outStr += `v.leftarm.y=-v.rightarm.y;`; 
        else if (used.has("v.leftarm.y") && !used.has("v.rightarm.y")) outStr += `v.rightarm.y=-v.leftarm.y;`; 

        if (used.has("v.rightarm.z") && !used.has("v.leftarm.z")) outStr += `v.leftarm.z=-v.rightarm.z;`; 
        else if (used.has("v.leftarm.z") && !used.has("v.rightarm.z")) outStr += `v.rightarm.z=-v.leftarm.z;`; 

        if (used.has("v.rightarm.ypos") && !used.has("v.leftarm.ypos")) outStr += `v.leftarm.ypos=v.rightarm.ypos;`; 
        else if (used.has("v.leftarm.ypos") && !used.has("v.rightarm.ypos")) outStr += `v.rightarm.ypos=v.leftarm.ypos;`; 
    } 
    
    if (mirrorLegs) { 
        if (used.has("v.rightleg.x") && !used.has("v.leftleg.x")) outStr += `v.leftleg.x=v.rightleg.x;`; 
        else if (used.has("v.leftleg.x") && !used.has("v.rightleg.x")) outStr += `v.rightleg.x=v.leftleg.x;`; 
    } 
    document.getElementById('output').value = outStr; 
} 

function copyCode() { 
    let outputBox = document.getElementById('output'); 
    outputBox.select(); 
    document.execCommand('copy'); 
} 

const container = document.getElementById('canvas-container'); 
const scene = new THREE.Scene(); 
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000); 
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); 
renderer.setSize(container.clientWidth, container.clientHeight); 
container.appendChild(renderer.domElement); 
const controls = new THREE.OrbitControls(camera, renderer.domElement); 
camera.position.set(30, 24, 60); 
controls.target.set(0, 15, 0); 
controls.update(); 
scene.add(new THREE.AmbientLight(0xffffff, 0.8)); 
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6); 
dirLight.position.set(10, 20, 10); 
scene.add(dirLight); 

function createMinecraftBoxGeometry(size, uvOffset, inflate = 0, mirror = false) { 
    const [w, h, d] = size; 
    const geom = new THREE.BoxGeometry(w + inflate * 2, h + inflate * 2, d + inflate * 2); 
    const [u, v] = uvOffset; 
    const tw = 64, th = 64; 
    let faces; 
    if (!mirror) { 
        faces = [ [u + d + w, v + d, d, h], [u, v + d, d, h], [u + d, v, w, d], [u + d + w, v, w, d], [u + d, v + d, w, h], [u + d + w + d, v + d, w, h] ]; 
    } else { 
        faces = [ [u, v + d, d, h], [u + d + w, v + d, d, h], [u + d + w, v, -w, d], [u + d + w + w, v, -w, d], [u + d + w, v + d, -w, h], [u + d + w + d + w, v + d, -w, h] ]; 
    } 
    const uvAttr = geom.attributes.uv; 
    let pos = 0; 
    faces.forEach(([x, y, fw, fh]) => { 
        const u0 = x / tw, v0 = 1 - (y + fh) / th; 
        const u1 = (x + fw) / tw, v1 = 1 - y / th; 
        uvAttr.setXY(pos++, u0, v1); uvAttr.setXY(pos++, u1, v1); uvAttr.setXY(pos++, u0, v0); uvAttr.setXY(pos++, u1, v0); 
    }); 
    uvAttr.needsUpdate = true; 
    return geom; 
} 

const textureLoader = new THREE.TextureLoader(); 
let skinTexture = null; 
const baseMaterial = new THREE.MeshStandardMaterial({ roughness: 0.8, metalness: 0.1 }); 
const outerMaterial = new THREE.MeshStandardMaterial({ roughness: 0.8, metalness: 0.1, transparent: true, alphaTest: 0.5, side: THREE.DoubleSide }); 
const modelBones = [ 
    { name: "root", pivot: [0, 0, 0] }, 
    { name: "waist", parent: "root", pivot: [0, 12, 0] }, 
    { name: "body", parent: "waist", pivot: [0, 24, 0], cubes: [ { origin: [-4, 12, -2], size: [8, 12, 4], uv: [16, 16], outer: false }, { origin: [-4, 12, -2], size: [8, 12, 4], uv: [16, 32], outer: true, inflate: 0.25 } ] }, 
    { name: "head", parent: "body", pivot: [0, 24, 0], cubes: [ { origin: [-4, 24, -4], size: [8, 8, 8], uv: [0, 0], outer: false }, { origin: [-4, 24, -4], size: [8, 8, 8], uv: [32, 0], outer: true, inflate: 0.5 } ] }, 
    { name: "leftArm", parent: "body", pivot: [5, 22, 0], cubes: [ { origin: [4, 12, -2], size: [4, 12, 4], uv: [32, 48], outer: false }, { origin: [4, 12, -2], size: [4, 12, 4], uv: [48, 48], outer: true, inflate: 0.25 } ] }, 
    { name: "rightArm", parent: "body", pivot: [-5, 22, 0], cubes: [ { origin: [-8, 12, -2], size: [4, 12, 4], uv: [40, 16], outer: false }, { origin: [-8, 12, -2], size: [4, 12, 4], uv: [40, 32], outer: true, inflate: 0.25 } ] }, 
    { name: "leftLeg", parent: "root", pivot: [1.9, 12, 0], cubes: [ { origin: [-0.1, 0, -2], size: [4, 12, 4], uv: [16, 48], outer: false }, { origin: [-0.1, 0, -2], size: [4, 12, 4], uv: [0, 48], outer: true, inflate: 0.25 } ] }, 
    { name: "rightLeg", parent: "root", pivot: [-1.9, 12, 0], cubes: [ { origin: [-3.9, 0, -2], size: [4, 12, 4], uv: [0, 16], outer: false }, { origin: [-3.9, 0, -2], size: [4, 12, 4], uv: [0, 32], outer: true, inflate: 0.25 } ] } 
]; 

const boneObjects = {}; 
modelBones.forEach(b => { 
    const group = new THREE.Group(); 
    if (b.cubes) { 
        b.cubes.forEach(c => { 
            const geom = createMinecraftBoxGeometry(c.size, c.uv, c.inflate || 0, c.mirror || false); 
            const mat = c.outer ? outerMaterial : baseMaterial; 
            const mesh = new THREE.Mesh(geom, mat); 
            mesh.position.set( c.origin[0] + c.size[0]/2 - b.pivot[0], c.origin[1] + c.size[1]/2 - b.pivot[1], c.origin[2] + c.size[2]/2 - b.pivot[2] ); 
            group.add(mesh); 
        }); 
    } 
    boneObjects[b.name] = group; 
}); 

modelBones.forEach(b => { 
    const group = boneObjects[b.name]; 
    const parentPivot = b.parent ? (modelBones.find(x => x.name === b.parent).pivot || [0,0,0]) : [0,0,0]; 
    const initX = b.pivot[0] - parentPivot[0];
    const initY = b.pivot[1] - parentPivot[1];
    const initZ = b.pivot[2] - parentPivot[2];
    group.userData.initialPos = { x: initX, y: initY, z: initZ };
    group.position.set(initX, initY, initZ); 
    if (b.parent) boneObjects[b.parent].add(group); 
    else scene.add(group); 
}); 

function applyTexture(texture) { 
    texture.magFilter = THREE.NearestFilter; texture.minFilter = THREE.NearestFilter; 
    baseMaterial.map = texture; baseMaterial.color.setHex(0xffffff); baseMaterial.needsUpdate = true; 
    outerMaterial.map = texture; outerMaterial.color.setHex(0xffffff); outerMaterial.needsUpdate = true; 
} 

function loadTextureFromUrl(url) { 
    textureLoader.load(url, (tex) => { skinTexture = tex; applyTexture(skinTexture); }); 
} 

function resetSkin() { loadTextureFromUrl(DEFAULT_TEXTURE_URL); } 

function uploadSkin(event) { 
    const file = event.target.files[0]; 
    if (!file) return; 
    const reader = new FileReader(); 
    reader.onload = (e) => { 
        const img = new Image(); 
        img.onload = () => { const texture = new THREE.Texture(img); texture.needsUpdate = true; applyTexture(texture); }; 
        img.src = e.target.result; 
    }; 
    reader.readAsDataURL(file); 
    event.target.value = ''; 
} 

loadTextureFromUrl(DEFAULT_TEXTURE_URL); 

let isPlaying = true; 
let animTime = 0; 
const clock = new THREE.Clock(); 

function togglePlay() { isPlaying = !isPlaying; } 

function getEase(name, t) { 
    t = Math.max(0, Math.min(1, t)); 
    if (name === 'lerp') return t; 
    if (name === 'ease_out_back') return 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2); 
    if (name === 'ease_out_elastic') return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1; 
    if (name === 'ease_in_out_sine') return -(Math.cos(Math.PI * t) - 1) / 2; 
    if (name === 'ease_out_sine') return Math.sin((t * Math.PI) / 2); 
    return t; 
} 

function animate() { 
    requestAnimationFrame(animate); 
    let dt = clock.getDelta(); 
    if (isPlaying) animTime += dt; 

    let maxDur = 0;
    data.forEach(bData => {
        bData.segments.forEach(seg => {
            let end = seg.start + seg.dur;
            if (end > maxDur) maxDur = end;
        });
    });
    let totalAnimDuration = Math.max(maxDur, 0.1); 

    let t = animTime % totalAnimDuration; 
    const mapName = (str) => { 
        if(str.includes("rightarm")) return "rightArm"; 
        if(str.includes("leftarm")) return "leftArm"; 
        if(str.includes("rightleg")) return "rightLeg"; 
        if(str.includes("leftleg")) return "leftLeg"; 
        if(str.includes("body")) return "waist"; 
        if(str.includes("head")) return "head"; 
        return "root"; 
    }; 

    Object.values(boneObjects).forEach(b => {
        b.rotation.set(0, 0, 0);
        if (b.userData.initialPos) {
            b.position.set(b.userData.initialPos.x, b.userData.initialPos.y, b.userData.initialPos.z);
        }
    });

    let currentValues = {}; 
    data.forEach(bData => { 
        let val = 0; 
        bData.segments.forEach((seg, idx) => { 
            if (idx === 0) val = seg.val1; 
            if (t >= seg.start) { 
                let progress = Math.min((t - seg.start) / seg.dur, 1); 
                val = val + (seg.val2 - val) * getEase(seg.ease, progress); 
            } 
        }); 
        currentValues[bData.bone] = val; 
    }); 

    // 3D Bidirectional Mirror Handling
    if (document.getElementById('mirrorArms').checked) { 
        if(currentValues["v.rightarm.x"] !== undefined && currentValues["v.leftarm.x"] === undefined) currentValues["v.leftarm.x"] = currentValues["v.rightarm.x"]; 
        else if(currentValues["v.leftarm.x"] !== undefined && currentValues["v.rightarm.x"] === undefined) currentValues["v.rightarm.x"] = currentValues["v.leftarm.x"]; 

        if(currentValues["v.rightarm.y"] !== undefined && currentValues["v.leftarm.y"] === undefined) currentValues["v.leftarm.y"] = -currentValues["v.rightarm.y"]; 
        else if(currentValues["v.leftarm.y"] !== undefined && currentValues["v.rightarm.y"] === undefined) currentValues["v.rightarm.y"] = -currentValues["v.leftarm.y"]; 

        if(currentValues["v.rightarm.z"] !== undefined && currentValues["v.leftarm.z"] === undefined) currentValues["v.leftarm.z"] = -currentValues["v.rightarm.z"]; 
        else if(currentValues["v.leftarm.z"] !== undefined && currentValues["v.rightarm.z"] === undefined) currentValues["v.rightarm.z"] = -currentValues["v.leftarm.z"]; 

        if(currentValues["v.rightarm.ypos"] !== undefined && currentValues["v.leftarm.ypos"] === undefined) currentValues["v.leftarm.ypos"] = currentValues["v.rightarm.ypos"]; 
        else if(currentValues["v.leftarm.ypos"] !== undefined && currentValues["v.rightarm.ypos"] === undefined) currentValues["v.rightarm.ypos"] = currentValues["v.leftarm.ypos"]; 
    } 

    if (document.getElementById('mirrorLegs').checked) { 
        if(currentValues["v.rightleg.x"] !== undefined && currentValues["v.leftleg.x"] === undefined) currentValues["v.leftleg.x"] = currentValues["v.rightleg.x"]; 
        else if(currentValues["v.leftleg.x"] !== undefined && currentValues["v.rightleg.x"] === undefined) currentValues["v.rightleg.x"] = currentValues["v.leftleg.x"]; 
    } 

    for (const [key, val] of Object.entries(currentValues)) { 
        let targetBone = boneObjects[mapName(key)]; 
        if (!targetBone) continue; 

        if (key === "v.rightarm.ypos" || key === "v.leftarm.ypos") {
            targetBone.position.y += val;
            continue;
        }

        let rad = val * (Math.PI / 180); 
        const invertedBones = ["v.rightarm.y", "v.leftarm.y", "v.rightarm.z", "v.leftarm.z", "v.head.y", "v.head.z", "v.body.y", "v.body.z"];
        if (invertedBones.includes(key)) rad = -rad;

        if (key.endsWith(".x")) targetBone.rotation.x = rad; 
        if (key.endsWith(".y")) targetBone.rotation.y = rad; 
        if (key.endsWith(".z")) targetBone.rotation.z = rad; 
    } 

    controls.update(); 
    renderer.render(scene, camera); 
} 

renderBones(); 
animate();
