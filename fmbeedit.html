<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffab05">
<title>FMBE Edit</title>
<script>
/* Penangkap error paling awal: kalau ada masalah, pesannya tampil di bawah layar */
(function () {
  window.__showError = function (msg) {
    function put() {
      var b = document.getElementById('errbar');
      if (!b) {
        b = document.createElement('div');
        b.id = 'errbar';
        b.onclick = function () { b.style.display = 'none'; b.textContent = ''; };
        document.body.appendChild(b);
      }
      b.style.display = 'block';
      b.textContent = (b.textContent ? b.textContent + '\n' : '') + msg;
    }
    if (document.body) put(); else document.addEventListener('DOMContentLoaded', put);
  };
  window.addEventListener('error', function (e) {
    var m = e && e.message ? String(e.message) : 'error';
    if (m.indexOf('ResizeObserver') >= 0) return;
    window.__showError('Error: ' + m + (e.lineno ? ' (baris ' + e.lineno + ')' : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    window.__showError('Error: ' + ((e.reason && e.reason.message) || e.reason));
  });
})();
</script>
<style>
:root{--ui:14px;--vh:100vh;--bar:clamp(46px,8.5vh,68px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  position:fixed;inset:0;color:#fff;
  font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  background-color:#101115;
  background-image:conic-gradient(#14151a 25%,transparent 0 50%,#14151a 0 75%,transparent 0);
  background-size:44px 44px;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at 50% 58%,transparent 42%,rgba(0,0,0,.5))}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit;user-select:text;-webkit-user-select:text}

#errbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:100;max-height:35vh;overflow:auto;
  background:#7a1010;color:#fff;font:600 12px/1.35 ui-monospace,Consolas,monospace;padding:.6em .9em;white-space:pre-wrap;user-select:text}

/* ---------- Top bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:5;background:#ffab05;
  display:flex;align-items:center;gap:calc(var(--bar)*.28);padding:0 calc(var(--bar)*.3);
  box-shadow:0 .25em 1em rgba(0,0,0,.45);overflow:hidden;color:#000}
#topbar::after{content:'';position:absolute;top:0;bottom:0;width:22%;left:-30%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
  animation:sweep 7s ease-in-out 1.2s infinite}
@keyframes sweep{0%{left:-30%}35%,100%{left:120%}}
#topbar svg{height:calc(var(--bar)*.74);width:auto;flex:none;shape-rendering:crispEdges}
#topbar h1{margin:0;font:900 calc(var(--bar)*.66)/1 'Nunito',ui-rounded,system-ui,sans-serif;letter-spacing:-.025em;white-space:nowrap}
#topbar .by{margin-left:auto;text-align:center;font:800 calc(var(--bar)*.3)/1.12 'Nunito',ui-rounded,system-ui,sans-serif;white-space:nowrap}

/* ---------- 3D stage (3 kanvas bertumpuk: grid / block / gizmo) ---------- */
#stage{position:fixed;left:0;right:0;bottom:0;top:var(--bar);z-index:0}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
#stage canvas#view{pointer-events:auto;touch-action:none;outline:none}

/* ---------- GUI base ---------- */
.gui{position:fixed;left:0;top:0;width:var(--w);max-height:calc(var(--vh) - 10px);font-size:var(--ui);
  display:flex;flex-direction:column;border-radius:.95em;overflow:hidden;z-index:10;
  box-shadow:0 .5em 1.5em rgba(0,0,0,.5),0 0 0 .07em rgba(255,255,255,.07);
  transition:box-shadow .2s,transform .2s;
  animation:guiIn .65s cubic-bezier(.2,.9,.25,1.12) backwards;animation-delay:var(--d,0s)}
.gui.dragging{box-shadow:0 1em 2.4em rgba(0,0,0,.6),0 0 0 .1em rgba(255,255,255,.18);transform:scale(1.015)}
@keyframes guiIn{from{opacity:0;transform:translateY(1.4em) scale(.94)}}
.title{position:relative;flex:none;height:2.7em;display:flex;align-items:center;justify-content:center;
  cursor:grab;touch-action:none;color:#fff}
.gui.dragging .title{cursor:grabbing}
.ttl{font:600 1.3em/1 'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;text-shadow:0 .06em .12em rgba(0,0,0,.25);pointer-events:none}
.fold{position:absolute;right:.55em;top:50%;width:1.9em;height:1.9em;margin-top:-.95em;border:0;border-radius:50%;
  background:rgba(255,255,255,.22);padding:0;transition:background .2s,transform .15s}
.fold:hover{background:rgba(255,255,255,.36)}
.fold:active{transform:scale(.88)}
.fold i{position:absolute;left:50%;top:50%;width:.95em;height:.17em;margin:-.085em 0 0 -.475em;border-radius:1em;background:#fff;
  transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.fold i.v{transform:rotate(90deg) scaleX(0)}
.gui.collapsed .fold i.v{transform:rotate(90deg) scaleX(1)}
.collapsible{display:grid;grid-template-rows:1fr;flex:1 1 auto;min-height:0;transition:grid-template-rows .38s cubic-bezier(.3,.9,.3,1),visibility 0s}
.gui.collapsed .collapsible{grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .38s cubic-bezier(.3,.9,.3,1),visibility 0s .38s}
.inner{min-height:0;min-width:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
.inner::-webkit-scrollbar{display:none}

/* ---------- GUI 1 : Block Entity ---------- */
.g-be{--w:16.5em;background:#9a5535}
.g-be .title{background:#ffbb5c}
.be-body{padding:.9em;min-height:12.5em}
.be-list{--rowH:2.6em;--gap:.65em;position:relative;margin:-.4em;
  height:calc(.8em + (var(--n,1) + 1) * (var(--rowH) + var(--gap)) - var(--gap));
  max-height:50vh;overflow-y:auto;overflow-x:hidden;transition:height .4s cubic-bezier(.3,1.2,.5,1);scrollbar-width:none}
.be-list::-webkit-scrollbar{display:none}
.row{position:absolute;left:.4em;right:.4em;top:0;height:var(--rowH);z-index:1;
  transform:translateY(calc(.4em + var(--i,0) * (var(--rowH) + var(--gap))));
  transition:transform .45s cubic-bezier(.34,1.35,.5,1),opacity .28s,left .3s}
.row.grp-row{z-index:2}
.row.child{left:1.55em}
.row.child::before{content:'';position:absolute;left:-.85em;top:-.7em;width:.6em;height:calc(50% + .7em);pointer-events:none;
  border-left:.14em solid rgba(255,255,255,.38);border-bottom:.14em solid rgba(255,255,255,.38);border-radius:0 0 0 .45em}
.row.hid{opacity:0;pointer-events:none;z-index:0}
.row.cancel-row{opacity:0;pointer-events:none;z-index:0}
#beList.selmode .row.cancel-row{opacity:1;pointer-events:auto;z-index:1}
.pw{height:100%;transition:transform .22s,opacity .22s;animation:pop .42s cubic-bezier(.2,1.5,.4,1) backwards}
.row.removing .pw{transform:scale(.7);opacity:0}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}

.fox-btn{display:flex;align-items:center;height:100%;padding:0 .3em 0 .6em;border-radius:.8em;background:#ff7622;
  box-shadow:0 .18em 0 rgba(110,35,0,.35);cursor:pointer;position:relative;
  transition:transform .2s,background .25s,box-shadow .25s}
.fox-btn:active{transform:scale(.97)}
.fox-btn.grp{background:#e2521a;padding-left:.55em}
.fox-btn .ico{width:1.85em;height:1.85em;flex:none;transition:transform .3s cubic-bezier(.3,1.6,.5,1),filter .25s}
.fox-btn .name{flex:1 1 0;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .3em;
  font:600 1.1em/1 'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;color:#fff}
.fox-btn.sel{background:linear-gradient(180deg,#ffa347,#ff7a22);
  box-shadow:0 0 0 .17em #fff3b8,0 0 .9em .1em rgba(255,222,110,.85);animation:glow 1.9s ease-in-out infinite alternate}
.fox-btn.target{box-shadow:0 0 0 .17em #fff3b8,0 0 .9em .1em rgba(255,222,110,.7)}
.fox-btn.grp.sel{background:linear-gradient(180deg,#ff8a3d,#ee5f1c)}
.fox-btn.sel .ico{transform:scale(1.12) rotate(-6deg);filter:brightness(1.7)}
@keyframes glow{from{box-shadow:0 0 0 .17em #fff3b8,0 0 .5em 0 rgba(255,222,110,.6)}to{box-shadow:0 0 0 .17em #fff3b8,0 0 1em .15em rgba(255,222,110,.95)}}

/* tombol buka/tutup Group */
.chev{flex:none;width:1.9em;height:1.9em;border:0;border-radius:50%;background:rgba(255,255,255,.16);padding:0;margin-right:.15em;
  display:grid;place-items:center;transition:background .2s,opacity .2s}
.chev:hover{background:rgba(255,255,255,.3)}
.chev svg{width:1.1em;height:1.1em;transition:transform .36s cubic-bezier(.3,1.4,.5,1)}
.chev path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.row.open .chev svg{transform:rotate(180deg)}
.chev.empty{opacity:.35;pointer-events:none}

/* ":" <-> kotak centang */
.tail{position:relative;flex:none;width:2em;height:100%;margin-right:.1em}
.dots{position:absolute;inset:0;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em;
  transition:transform .3s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.dots i{width:.36em;height:.36em;border-radius:50%;background:#fff;transition:transform .2s}
.dots:hover i{transform:scale(1.25)}
#beList.selmode .dots{transform:scale(0) rotate(90deg);opacity:0;pointer-events:none}
.chk{position:absolute;left:50%;top:50%;width:1.6em;height:1.6em;margin:-.8em 0 0 -.8em;opacity:0;transform:scale(0) rotate(-45deg);pointer-events:none;
  transition:transform .36s cubic-bezier(.2,1.7,.4,1),opacity .2s}
#beList.selmode .chk{opacity:1;transform:none;pointer-events:auto}
#beList.selmode .chk.dis{opacity:.35}
#beList.selmode .chk.hide{opacity:0;transform:scale(0);pointer-events:none}
.chk .box{width:100%;height:100%;border-radius:.42em;background:#fff5da;border:.2em solid #ffbf87;display:flex;align-items:center;justify-content:center;
  transition:background .2s}
.chk .box svg{width:80%;height:80%;overflow:visible}
.chk .box path{fill:none;stroke:#111;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;
  transition:stroke-dashoffset .32s ease .08s}
.chk.on .box{background:#ffe9b8;animation:chkpop .42s cubic-bezier(.2,1.6,.4,1)}
.chk.on .box path{stroke-dashoffset:0}
@keyframes chkpop{0%{transform:scale(.7)}55%{transform:scale(1.22)}100%{transform:scale(1)}}

/* tombol Add <-> Add Group, dan Cancel */
.fox-btn.add{position:relative;justify-content:center;padding:0}
.fox-btn.add .lbl{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#fff;
  font:600 1.1em/1 'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;transition:opacity .25s,transform .34s cubic-bezier(.3,1.3,.5,1)}
.fox-btn.add .lbl.g,.fox-btn.add .lbl.m{opacity:0;transform:translateY(.9em)}
#beList.selmode .add .lbl.a{opacity:0;transform:translateY(-.9em)}
#beList.selnew .add .lbl.g{opacity:1;transform:none}
#beList.seladd .add .lbl.m{opacity:1;transform:none}
.fox-btn.cancel{justify-content:center;background:#c25a2c;padding:0}
.fox-btn.cancel .name{flex:none;font-size:1.1em;padding:0}

/* dim + menu (Duplicate / Select / Delete) */
.dim{position:absolute;inset:0;z-index:20;background:rgba(28,10,0,.66);opacity:0;pointer-events:none;transition:opacity .28s}
.menu-open .dim{opacity:1;pointer-events:auto}
.menu{position:absolute;z-index:21;width:0;height:0;pointer-events:none}
.menu .yb{position:absolute;left:0;top:0;width:2.5em;height:2.5em;margin:-1.25em 0 0 -1.25em;border:0;padding:0;border-radius:50%;
  background:#ffe24f;box-shadow:0 .12em .5em rgba(0,0,0,.35);transform:scale(0);transition:transform .38s cubic-bezier(.2,1.8,.4,1)}
.menu .yb i{position:absolute;top:50%;width:.42em;height:.42em;margin-top:-.21em;border-radius:50%;background:#fff8cf}
.menu .yb i:first-child{left:32%;margin-left:-.21em}
.menu .yb i:last-child{left:68%;margin-left:-.21em}
.menu .ln{position:absolute;left:0;top:0;height:.16em;margin-top:-.08em;width:var(--len,0px);border-radius:1em;background:#fff;
  transform-origin:0 50%;transform:rotate(var(--ang,0deg)) scaleX(0);transition:transform .26s ease .06s}
.menu .pill{position:absolute;border:0;border-radius:2em;background:#fff;color:#4a2a12;padding:.5em 1em;
  font:700 .85em/1 'Nunito',ui-rounded,system-ui,sans-serif;white-space:nowrap;box-shadow:0 .12em .4em rgba(0,0,0,.3);
  transform:translate(-50%,-50%) scale(0);transition:transform .34s cubic-bezier(.2,1.7,.4,1) .12s,background .15s}
.menu .pill.p2{transition-delay:.17s}
.menu .pill.p3{transition-delay:.22s;color:#c2321f}
.menu .pill:active{background:#ffe9c8}
.menu-open .menu .yb{transform:scale(1);pointer-events:auto}
.menu-open .menu .ln{transform:rotate(var(--ang,0deg)) scaleX(1)}
.menu-open .menu .pill{transform:translate(-50%,-50%) scale(1);pointer-events:auto}

/* ---------- GUI 2 : Main ---------- */
.g-main{--w:23em;background:#474747}
.g-main .title{background:#555}
.tabs{display:flex;justify-content:space-between;gap:.5em}
.tab{border:0;padding:.4em 1.5em .45em;border-radius:0 0 .85em .85em;background:#505050;color:#b4b4b4;max-width:14em;overflow:hidden;
  font:600 1.12em/1.1 'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;white-space:nowrap;
  transition:background .25s,color .25s,max-width .34s cubic-bezier(.3,.9,.3,1),padding .34s,opacity .25s,margin .34s}
.tab.active{background:#727272;color:#fff}
.tab.gone{max-width:0;padding-left:0;padding-right:0;opacity:0;margin-left:-.5em;pointer-events:none}
.panes{display:grid}
.pane{grid-area:1/1;min-width:0;opacity:0;visibility:hidden;transform:translateY(.7em);pointer-events:none;
  transition:opacity .25s,transform .3s cubic-bezier(.3,1,.4,1),visibility 0s .25s}
.pane.active{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .28s .05s,transform .32s cubic-bezier(.3,1,.4,1) .05s,visibility 0s}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4em;padding:.6em .7em .9em}
.col{min-width:0;border-radius:.85em;padding:.15em .3em .4em;transition:background .3s}
.col.active{background:rgba(255,255,255,.055)}
.colhead{display:block;width:100%;border:0;background:none;color:#cfcfcf;font:600 1em/1 'Nunito',ui-rounded,system-ui,sans-serif;padding:.55em 0 .5em;
  position:relative;transition:color .25s,opacity .25s}
.colhead::after{content:'';position:absolute;left:28%;right:28%;bottom:.1em;height:.17em;border-radius:1em;background:#4fe0f0;
  transform:scaleX(0);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.col.active .colhead{color:#fff}
.col.active .colhead::after{transform:scaleX(1)}
.col.locked .colhead{opacity:.4;pointer-events:none}
.col.locked .fld:not(.snapf){opacity:.4}
.fld{display:flex;gap:.3em;margin-top:.5em;min-width:0;transition:opacity .25s}
.bdg{flex:0 0 1.95em;height:2.1em;border-radius:.65em;background:#000;display:flex;align-items:center;justify-content:center;
  font:700 .95em/1 'Nunito',ui-rounded,system-ui,sans-serif}
.bdg b{font-weight:700}
.bdg.x{color:#ff2f2f}.bdg.y{color:#b4ff2b}.bdg.z{color:#6b7bff}.bdg.s{color:#fff;font-size:.8em}
.bdg.xz b:first-child{color:#ff2f2f}.bdg.xz b:last-child{color:#6b7bff;margin-left:-.28em}
.fld input{flex:1 1 0;width:0;min-width:0;height:2.1em;border:0;border-radius:.7em;background:#000;color:#80e4ff;padding:0 .55em;
  font:600 .95em/1 'Nunito',ui-rounded,system-ui,sans-serif;outline:none;transition:box-shadow .2s,opacity .2s}
.fld input:focus{box-shadow:0 0 0 .14em rgba(79,224,240,.7)}
.fld input:disabled{opacity:.4}
.exp-wrap{padding:.9em 1em 1em}
.exp{height:8em;overflow-y:auto;background:#000;border-radius:.9em;padding:.8em .95em;color:#e8f6a4;
  font:500 .98em/1.35 'Nunito',ui-rounded,system-ui,sans-serif;word-break:break-all;user-select:text;-webkit-user-select:text;
  scrollbar-width:thin;scrollbar-color:#444 transparent}
.copy{display:block;width:100%;margin-top:.9em;border:0;border-radius:.9em;background:#506fff;color:#52e3f5;
  font:700 1.6em/1 'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;padding:.5em 0;transition:transform .15s,background .25s,color .25s}
.copy:active{transform:scale(.97)}
.copy.done{background:#2fbf7a;color:#eafff4;animation:bump .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}

/* ---------- GUI 3 : Texture changer ---------- */
.g-tex{--w:15.5em;background:#0298b3}
.g-tex .title{background:#0dc0e0}
.g-tex .ttl{font-family:'Nunito',ui-rounded,system-ui,sans-serif;font-weight:600;font-size:1.22em}
.tex-body{padding:1em}
.preview{width:82%;aspect-ratio:1;margin:.2em auto 1em;border-radius:.4em;outline:.07em dashed rgba(255,255,255,.14)}
.preview canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.up{display:block;width:100%;border:0;border-radius:.75em;background:#6cf5ff;color:#0a86d6;
  font:600 1.08em/1 'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;padding:.9em 0;transition:transform .15s,background .2s}
.up:hover{background:#8afaff}
.up:active{transform:scale(.97)}
.note{margin-top:.55em;text-align:center;font:400 .88em/1.2 'Bree Serif',Georgia,serif;color:#fff;transition:color .25s}
.note.bad{color:#ff2b2b;font-weight:700;text-shadow:0 0 .5em rgba(0,0,0,.4);animation:shake .42s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-.4em)}40%{transform:translateX(.4em)}60%{transform:translateX(-.25em)}80%{transform:translateX(.25em)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>

<header id="topbar">
  <svg viewBox="0 0 12 11" aria-hidden="true">
    <rect x="1" y="0" width="1" height="1" fill="#1d0d00"/>
    <rect x="10" y="0" width="1" height="1" fill="#1d0d00"/>
    <rect x="0" y="1" width="12" height="10" fill="#1d0d00"/>
    <rect x="0" y="8" width="12" height="3" fill="#3a1e08"/>
    <rect x="2" y="6" width="1.4" height="1.4" fill="#fff"/>
    <rect x="8.6" y="6" width="1.4" height="1.4" fill="#fff"/>
    <rect x="4.5" y="8" width="3" height="1.3" fill="#000"/>
  </svg>
  <h1>FMBE Edit</h1>
  <div class="by">Made by:<br>ZeLuckyMc</div>
</header>

<div id="stage">
  <canvas id="cGrid"></canvas>
  <canvas id="cGL"></canvas>
  <canvas id="view"></canvas>
</div>

<!-- GUI 1 : Block Entity -->
<section class="gui g-be" id="guiBE" style="--d:.05s">
  <div class="title"><span class="ttl">Block Entity</span><button class="fold" aria-label="Buka / tutup"><i class="h"></i><i class="v"></i></button></div>
  <div class="collapsible"><div class="inner">
    <div class="be-body"><div class="be-list" id="beList"></div></div>
  </div></div>
  <div class="dim" id="beDim"></div>
  <div class="menu" id="beMenu">
    <i class="ln l1"></i><i class="ln l2"></i><i class="ln l3"></i>
    <button class="pill p1" id="pillDup">Duplicate</button>
    <button class="pill p2" id="pillSel">Select</button>
    <button class="pill p3" id="pillDl">Delete</button>
    <button class="yb" id="yb" aria-label="Tutup menu"><i></i><i></i></button>
  </div>
</section>

<!-- GUI 2 : Main -->
<section class="gui g-main" id="guiMain" style="--d:.15s">
  <div class="title"><span class="ttl">Main</span><button class="fold" aria-label="Buka / tutup"><i class="h"></i><i class="v"></i></button></div>
  <div class="collapsible"><div class="inner">
    <div class="tabs">
      <button class="tab active" data-tab="prs">P&amp;R&amp;S</button>
      <button class="tab" data-tab="expr">Stop Expression</button>
    </div>
    <div class="panes">
      <div class="pane active" id="pane-prs">
        <div class="cols">
          <div class="col active" data-mode="position">
            <button class="colhead">Position</button>
            <div class="fld"><span class="bdg x">X</span><input data-k="px" autocomplete="off" spellcheck="false"></div>

<script>
(function () {
'use strict';

/* =====================================================================
   FMBE Edit  -  satu file, tanpa library eksternal.
   3D memakai WebGL murni (cadangan: Canvas 2D). Semua GUI berdiri sendiri,
   jadi tetap jalan walaupun bagian 3D bermasalah.
   Rotation order: ZYX  ->  R = Rz * Ry * Rx
   ===================================================================== */

/* ================= util ================= */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rad = d => d * Math.PI / 180;
const deg = r => r * 180 / Math.PI;
const fmt = n => { let v = Math.round(n * 10000) / 10000; if (v === 0) v = 0; return String(v); };
const r4 = n => { const v = Math.round(n * 10000) / 10000; return v === 0 ? 0 : v; };
function fail(where, err) {
  try { console.error(where, err); } catch (_) {}
  if (window.__showError) window.__showError(where + ': ' + ((err && err.message) || err));
}

const DEFAULT_TEX_URL = 'https://raw.githubusercontent.com/Azizanzz0/Image/refs/heads/main/texture.png';
const ADD_LABEL = '+ Add New Block';   // ganti ke '+ Add New Fox' kalau mau

/* font dimuat belakangan (tidak menghalangi script) */
try {
  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=Bree+Serif&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap';
  document.head.appendChild(l);
} catch (_) {}

/* ================= vektor & matriks kecil ================= */
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  madd: (a, b, s) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
};
// matriks 3x3 (row-major, 9 angka)
const I3 = [1, 0, 0, 0, 1, 0, 0, 0, 1];
const rotX = a => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; };
const rotY = a => { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; };
const rotZ = a => { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; };
function mul3(a, b) {
  const r = new Array(9);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
    r[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j];
  return r;
}
const mulv3 = (m, v) => [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]];
const col3 = (m, j) => [m[j], m[3 + j], m[6 + j]];
// urutan ZYX:  R = Rz * Ry * Rx   (derajat)
const eulerR = rot => mul3(rotZ(rad(rot[2])), mul3(rotY(rad(rot[1])), rotX(rad(rot[0]))));
// matriks 4x4 (column-major, 16 angka)
function mul4(a, b) {
  const o = new Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0;
    for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
    o[c * 4 + r] = s;
  }
  return o;
}

/* ================= state & transform ================= */
// node: fox {type:'fox', name, pos, rot, sxz, sy, group}  |  group {type:'group', name, pos, rot, children[], open}
const state = { items: [], selected: null, mode: 'position', snap: 0.1, selMode: null, selTarget: null };
const items = state.items;                 // daftar tingkat atas (Fox atau Group)
let renderFoxes = [];                      // semua Fox (rata) yang digambar
let dirty = true;
function requestRender() { dirty = true; }

function flatNodes() {
  const out = [];
  items.forEach(it => { out.push(it); if (it.type === 'group') it.children.forEach(c => out.push(c)); });
  return out;
}
function rebuildFlat() { renderFoxes = flatNodes().filter(n => n.type === 'fox'); }

// nomor terkecil yang belum dipakai (Fox #1 dihapus -> yang baru kembali jadi Fox #1)
function nextNum(type) {
  const used = {};
  flatNodes().forEach(n => { if (n.type === type) used[n.num] = true; });
  let i = 1;
  while (used[i]) i++;
  return i;
}
function newFox() {
  const f = { type: 'fox', num: nextNum('fox'), name: '', pos: [0, 0, 0], rot: [0, 0, 0], sxz: 1, sy: 1, group: null, row: null };
  f.name = 'Fox #' + f.num;
  return f;
}
function newGroup() {                       // group = null: mulai di pos/rot 0, skala tidak bisa diubah
  const g = { type: 'group', num: nextNum('group'), name: '', pos: [0, 0, 0], rot: [0, 0, 0], sxz: 1, sy: 1, children: [], open: true, row: null };
  g.name = 'Group #' + g.num;
  return g;
}
function cloneFox(f) {
  const c = newFox();
  c.pos = f.pos.slice(); c.rot = f.rot.slice(); c.sxz = f.sxz; c.sy = f.sy;
  return c;
}

function blockXform(f) {                    // Fox selalu berputar/berpindah di titik pusatnya sendiri
  const R = eulerR(f.rot);
  return { R: R, c: [f.pos[0], 8 + f.pos[1], f.pos[2]], ex: col3(R, 0), ey: col3(R, 1), ez: col3(R, 2), sx: f.sxz, sy: f.sy, sz: f.sxz, PR: I3 };
}
function toWorld(x, p) {
  const a = p[0] * x.sx, b = p[1] * x.sy, c = p[2] * x.sz;
  return [x.c[0] + x.ex[0] * a + x.ey[0] * b + x.ez[0] * c,
          x.c[1] + x.ex[1] * a + x.ey[1] * b + x.ez[1] * c,
          x.c[2] + x.ex[2] * a + x.ey[2] * b + x.ez[2] * c];
}
function modelMat(x) {
  return [x.ex[0] * x.sx, x.ex[1] * x.sx, x.ex[2] * x.sx, 0,
          x.ey[0] * x.sy, x.ey[1] * x.sy, x.ey[2] * x.sy, 0,
          x.ez[0] * x.sz, x.ez[1] * x.sz, x.ez[2] * x.sz, 0,
          x.c[0], x.c[1], x.c[2], 1];
}

function getVal(f, k) {
  switch (k) {
    case 'px': return f.pos[0]; case 'py': return f.pos[1]; case 'pz': return f.pos[2];
    case 'rx': return f.rot[0]; case 'ry': return f.rot[1]; case 'rz': return f.rot[2];
    case 'sxz': return f.sxz;   case 'sy': return f.sy;
  }
  return 0;
}
const r6 = x => Math.round(x * 1e6) / 1e6;
// Ubah nilai pos/rot. Kalau yang diubah Group, semua Fox anggotanya ikut berubah sebesar selisihnya
// (tiap Fox tetap di titik pusatnya sendiri, bukan berputar mengelilingi pusat Group).
function setInternal(n, kind, idx, v) {
  const old = n[kind][idx];
  n[kind][idx] = v;
  if (n.type === 'group') {
    const d = v - old;
    if (d !== 0) n.children.forEach(c => { c[kind][idx] = r6(c[kind][idx] + d); });
  }
}
function setVal(f, k, v) {
  switch (k) {
    case 'px': setInternal(f, 'pos', 0, v); break; case 'py': setInternal(f, 'pos', 1, v); break; case 'pz': setInternal(f, 'pos', 2, v); break;
    case 'rx': setInternal(f, 'rot', 0, v); break; case 'ry': setInternal(f, 'rot', 1, v); break; case 'rz': setInternal(f, 'rot', 2, v); break;
    case 'sxz': f.sxz = v; break;   case 'sy': f.sy = v; break;
  }
}
/* Invers aditif: xpos, zpos, xrot, yrot dibaca berlawanan tanda oleh P&R&S dan Stop Expression.
   Contoh: rotasi Y model = 90  ->  P&R&S dan Stop Expression membaca -90. */
const INV = { px: true, pz: true, rx: true, ry: true };
const toDisp = (k, v) => INV[k] ? -v : v;      // nilai model -> angka yang ditampilkan
const fromDisp = (k, v) => INV[k] ? -v : v;    // angka yang diketik -> nilai model
function exprFor(f) {
  if (!f || f.type !== 'fox') return '""';
  const d = k => fmt(toDisp(k, getVal(f, k)));
  return '"v.xpos=' + d('px') + ';v.ypos=' + d('py') + ';v.zpos=' + d('pz') +
         ';v.xrot=' + d('rx') + ';v.yrot=' + d('ry') + ';v.zrot=' + d('rz') +
         ';v.xzscale=' + d('sxz') + ';v.yscale=' + d('sy') + ';"';
}

/* ================= texture ================= */
const texCanvas = document.createElement('canvas');
texCanvas.width = texCanvas.height = 64;
const tctx = texCanvas.getContext('2d');
tctx.imageSmoothingEnabled = false;
let texVer = 0, texData = null, texDataVer = -1;
function getTexData() {
  if (texDataVer !== texVer) {
    try { texData = tctx.getImageData(0, 0, 64, 64).data; } catch (e) { texData = null; }
    texDataVer = texVer;
  }
  return texData;
}
const prevCanvas = $('#texPrev');
const pctx = prevCanvas.getContext('2d');
pctx.imageSmoothingEnabled = false;
function commitTexture() {
  texVer++;
  pctx.clearRect(0, 0, 64, 64);
  pctx.drawImage(texCanvas, 0, 0);
  requestRender();
}
function drawFallbackTexture() {
  tctx.clearRect(0, 0, 64, 64);
  [[0, 0, '#22e622', '#78ff78'], [16, 0, '#ff5c5c', '#ff7878'], [32, 0, '#ffff3c', '#ffff78'],
   [48, 0, '#5a5aff', '#7878ff'], [16, 16, '#3cf0ff', '#78f5ff'], [48, 16, '#ff8c5a', '#ffa078']
  ].forEach(t => {
    tctx.fillStyle = t[2]; tctx.fillRect(t[0], t[1], 16, 16);
    tctx.fillStyle = t[3]; tctx.fillRect(t[0] + 1, t[1] + 1, 14, 14);
  });
}
drawFallbackTexture();
commitTexture();
(function loadDefaultTexture() {
  try {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function () {
      try { tctx.clearRect(0, 0, 64, 64); tctx.drawImage(img, 0, 0, 64, 64); commitTexture(); } catch (e) { /* pakai texture cadangan */ }
    };
    img.src = DEFAULT_TEX_URL;
  } catch (_) {}
})();

const note = $('#note');
function setNote(bad) {
  note.classList.remove('bad');
  if (bad) { void note.offsetWidth; note.classList.add('bad'); }
}
$('#upBtn').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', function () {
  const file = this.files && this.files[0];
  this.value = '';
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = function () {
    URL.revokeObjectURL(url);
    if (img.naturalWidth === 64 && img.naturalHeight === 64) {
      tctx.clearRect(0, 0, 64, 64);
      tctx.drawImage(img, 0, 0);
      commitTexture();
      setNote(false);
    } else setNote(true);
  };
  img.onerror = function () { URL.revokeObjectURL(url); setNote(true); };
  img.src = url;
});

/* ================= geometri block (sesuai model_block.json) =================
   cube origin [-8,0,-8] size 16, pivot [0,8,0]  ->  lokal -8..8 di sekitar pivot
   north=merah(-Z depan)  east=hijau(+X)  south=biru tua(+Z)  west=kuning(-X)
   up=biru muda  down=oren.  Sudut: kiri-atas, kanan-atas, kanan-bawah, kiri-bawah. */
const H8 = 8;
const FACES = [
  { n: [0, 0, -1], s: 0.8, uv: [16, 0, 16, 16],    c: [[H8, H8, -H8], [-H8, H8, -H8], [-H8, -H8, -H8], [H8, -H8, -H8]] },
  { n: [0, 0, 1],  s: 0.8, uv: [48, 0, 16, 16],    c: [[-H8, H8, H8], [H8, H8, H8], [H8, -H8, H8], [-H8, -H8, H8]] },
  { n: [1, 0, 0],  s: 0.6, uv: [0, 0, 16, 16],     c: [[H8, H8, H8], [H8, H8, -H8], [H8, -H8, -H8], [H8, -H8, H8]] },
  { n: [-1, 0, 0], s: 0.6, uv: [32, 0, 16, 16],    c: [[-H8, H8, -H8], [-H8, H8, H8], [-H8, -H8, H8], [-H8, -H8, -H8]] },
  { n: [0, 1, 0],  s: 1.0, uv: [32, 32, -16, -16], c: [[-H8, H8, -H8], [H8, H8, -H8], [H8, H8, H8], [-H8, H8, H8]] },
  { n: [0, -1, 0], s: 0.5, uv: [64, 32, -16, -16], c: [[-H8, -H8, H8], [H8, -H8, H8], [H8, -H8, -H8], [-H8, -H8, -H8]] }
];
function buildMesh() {
  const vb = [], ib = [];
  FACES.forEach((f, fi) => {
    const u0 = f.uv[0], v0 = f.uv[1], w = f.uv[2], h = f.uv[3];
    const t = [[u0, v0], [u0 + w, v0], [u0 + w, v0 + h], [u0, v0 + h]];
    for (let i = 0; i < 4; i++) vb.push(f.c[i][0], f.c[i][1], f.c[i][2], t[i][0] / 64, t[i][1] / 64, f.s, f.s, f.s);
    const o = fi * 4;
    ib.push(o, o + 3, o + 2, o, o + 2, o + 1);
  });
  return { vb: new Float32Array(vb), ib: new Uint16Array(ib) };
}

/* ================= kamera ================= */
const orbit = { target: [0, 8, 0], theta: -2.478, phi: 1.19, radius: 70 };
const cam = { eye: [0, 0, 0], f: [0, 0, -1], r: [1, 0, 0], u: [0, 1, 0], fov: 40, aspect: 1, W: 1, H: 1, tanV: Math.tan(rad(20)), tanH: Math.tan(rad(20)) };
function updateCam() {
  const o = orbit, sp = Math.sin(o.phi);
  cam.eye = [o.target[0] + o.radius * sp * Math.sin(o.theta), o.target[1] + o.radius * Math.cos(o.phi), o.target[2] + o.radius * sp * Math.cos(o.theta)];
  cam.f = V.norm(V.sub(o.target, cam.eye));
  cam.r = V.norm(V.cross(cam.f, [0, 1, 0]));
  cam.u = V.cross(cam.r, cam.f);
  cam.tanV = Math.tan(rad(cam.fov) / 2);
  cam.tanH = cam.tanV * cam.aspect;
}
function fitDistance() {
  const vf = rad(cam.fov), hf = 2 * Math.atan(cam.tanV * cam.aspect);
  orbit.radius = 23 / Math.sin(Math.min(vf, hf) / 2);
}
function viewZ(p) { return V.dot(V.sub(p, cam.eye), cam.f); }
function project(p) {                       // -> [x, y, z] (px CSS kanvas), atau null
  const d = V.sub(p, cam.eye);
  const z = V.dot(d, cam.f);
  if (z < 0.3) return null;
  const x = V.dot(d, cam.r), y = V.dot(d, cam.u);
  return [cam.W / 2 + (x / (z * cam.tanH)) * cam.W / 2, cam.H / 2 - (y / (z * cam.tanV)) * cam.H / 2, z];
}
function segScreen(a, b) {                   // potong di near-plane lalu proyeksikan
  const N = 0.5;
  const za = viewZ(a), zb = viewZ(b);
  if (za < N && zb < N) return null;
  if (za < N) a = V.add(a, V.mul(V.sub(b, a), (N - za) / (zb - za)));
  else if (zb < N) b = V.add(b, V.mul(V.sub(a, b), (N - zb) / (za - zb)));
  const pa = project(a), pb = project(b);
  return pa && pb ? [pa, pb] : null;
}
function pointerRay(cx, cy) {
  const nx = cx / cam.W * 2 - 1, ny = 1 - cy / cam.H * 2;
  const d = V.norm(V.add(V.add(cam.f, V.mul(cam.r, nx * cam.tanH)), V.mul(cam.u, ny * cam.tanV)));
  return { o: cam.eye, d: d };
}
function viewMat() {
  const r = cam.r, u = cam.u, f = cam.f, e = cam.eye;
  return [r[0], u[0], -f[0], 0, r[1], u[1], -f[1], 0, r[2], u[2], -f[2], 0, -V.dot(r, e), -V.dot(u, e), V.dot(f, e), 1];
}
function projMat() {
  const n = 0.5, fa = 3000, ff = 1 / cam.tanV;
  return [ff / cam.aspect, 0, 0, 0, 0, ff, 0, 0, 0, 0, (fa + n) / (n - fa), -1, 0, 0, 2 * fa * n / (n - fa), 0];
}
function panBy(dx, dy) {
  const upp = (2 * orbit.radius * cam.tanV) / Math.max(1, cam.H);
  const t = V.madd(V.madd(orbit.target, cam.r, -dx * upp), cam.u, dy * upp);
  orbit.target = [clamp(t[0], -200, 200), clamp(t[1], -50, 200), clamp(t[2], -200, 200)];
}

/* ================= kanvas & renderer ================= */
const stage = $('#stage'), cGrid = $('#cGrid'), cOv = $('#view');
let cMain = $('#cGL');
const gctx = cGrid.getContext('2d');
const octx = cOv.getContext('2d');
let mctx = null;      // konteks 2D (hanya kalau WebGL tidak ada)
let GL = null;
let dpr = 1, fitted = false;

/* ---------- WebGL ---------- */
const VS = 'attribute vec3 aPos;attribute vec2 aUV;attribute vec3 aCol;uniform mat4 uMVP;varying vec2 vUV;varying vec3 vCol;' +
           'void main(){vUV=aUV;vCol=aCol;gl_Position=uMVP*vec4(aPos,1.0);}';
const FS = 'precision mediump float;uniform sampler2D uTex;varying vec2 vUV;varying vec3 vCol;' +
           'void main(){vec4 t=texture2D(uTex,vUV);if(t.a<0.5)discard;gl_FragColor=vec4(t.rgb*vCol,1.0);}';
function initGL() {
  let gl = null;
  try { gl = cMain.getContext('webgl', { alpha: true, antialias: true, premultipliedAlpha: true, depth: true }) || cMain.getContext('experimental-webgl'); } catch (e) { gl = null; }
  if (!gl) return null;
  function sh(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('shader: ' + gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.bindAttribLocation(prog, 0, 'aPos');
  gl.bindAttribLocation(prog, 1, 'aUV');
  gl.bindAttribLocation(prog, 2, 'aCol');
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(prog));
  const mesh = buildMesh();
  const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo); gl.bufferData(gl.ARRAY_BUFFER, mesh.vb, gl.STATIC_DRAW);
  const ibo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.ib, gl.STATIC_DRAW);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);

      const out = V.sub(fcw, xf.c);

    panBy(newMx - oldMx, newMy - oldMy);
    requestRender();
  }
});
function releasePointer(e) {
  ptrs.delete(e.pointerId);
  if (drag && e.pointerId === drag.id) endDrag();
}
cOv.addEventListener('pointerup', releasePointer);
cOv.addEventListener('pointercancel', releasePointer);
cOv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && hoverAxis) { hoverAxis = null; requestRender(); } });
cOv.addEventListener('wheel', e => {
  e.preventDefault();
  orbit.radius = clamp(orbit.radius * Math.exp(e.deltaY * 0.0012), 12, 500);
  requestRender();
}, { passive: false });

/* ================= GUI: geser, lipat, tata letak ================= */
const guiBE = $('#guiBE'), guiMain = $('#guiMain'), guiTex = $('#guiTex');
const GUIS = [guiBE, guiMain, guiTex];
let zTop = 10, userMoved = false;

function vw() { return document.documentElement.clientWidth || window.innerWidth || 800; }
function vh() { return document.documentElement.clientHeight || window.innerHeight || 600; }
function setPos(gui, x, y) { gui.style.left = Math.round(x) + 'px'; gui.style.top = Math.round(y) + 'px'; }
function fitGui(gui) {                       // pastikan seluruh panel berada di dalam layar
  const W = vw(), H = vh(), w = gui.offsetWidth, h = gui.offsetHeight;
  const x = clamp(parseFloat(gui.style.left) || 0, 0, Math.max(0, W - w));
  const y = clamp(parseFloat(gui.style.top) || 0, 0, Math.max(0, H - h));
  setPos(gui, x, y);
}
function dragClamp(gui, x, y) {              // saat digeser: boleh sebagian keluar layar
  const w = gui.offsetWidth, th = $('.title', gui).offsetHeight;
  setPos(gui, clamp(x, -(w - 90), vw() - 90), clamp(y, 0, vh() - th));
}
function setupGui(gui) {
  const title = $('.title', gui), fold = $('.fold', gui);
  fold.addEventListener('pointerdown', e => e.stopPropagation());
  fold.addEventListener('click', () => {
    gui.classList.toggle('collapsed');
    if (gui === guiBE) closeMenu();
  });
  gui.addEventListener('pointerdown', () => { gui.style.zIndex = ++zTop; }, true);
  let d = null;
  title.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    d = { id: e.pointerId, ox: e.clientX - (parseFloat(gui.style.left) || 0), oy: e.clientY - (parseFloat(gui.style.top) || 0) };
    try { title.setPointerCapture(e.pointerId); } catch (_) {}
    gui.classList.add('dragging');
    e.preventDefault();
  });
  title.addEventListener('pointermove', e => {
    if (!d || e.pointerId !== d.id) return;
    dragClamp(gui, e.clientX - d.ox, e.clientY - d.oy);
    userMoved = true;
  });
  const end = e => { if (d && e.pointerId === d.id) { d = null; gui.classList.remove('dragging'); } };
  title.addEventListener('pointerup', end);
  title.addEventListener('pointercancel', end);
}
GUIS.forEach(setupGui);

function initialLayout() {
  const bar = $('#topbar').offsetHeight || 56;
  const W = vw(), H = vh(), m = W < 700 ? 8 : 16;
  if (W < 50 || H < 50) return;
  const mw = guiMain.offsetWidth, mh = guiMain.offsetHeight, tw = guiTex.offsetWidth;
  if (W >= 660) {
    setPos(guiBE, m, bar + m);
    setPos(guiMain, W - mw - m, bar + m);
    setPos(guiTex, W - tw - m, bar + m + mh + m);
  } else {
    setPos(guiBE, m, bar + m);
    setPos(guiTex, W - tw - m, bar + m);
    setPos(guiMain, (W - mw) / 2, H - mh - m);
  }
  GUIS.forEach(fitGui);
}
function updateUiScale() {
  const ui = clamp(vw() / 34, 11.5, 15);
  const root = document.documentElement.style;
  root.setProperty('--ui', ui.toFixed(2) + 'px');
  root.setProperty('--vh', vh() + 'px');
}
let relayoutRaf = 0;
function relayout() {
  if (relayoutRaf) cancelAnimationFrame(relayoutRaf);
  relayoutRaf = requestAnimationFrame(() => {
    relayoutRaf = 0;
    try {
      updateUiScale();
      resizeCanvas();
      if (!userMoved) initialLayout(); else GUIS.forEach(fitGui);
    } catch (e) { fail('layout', e); }
  });
}

/* ================= GUI 1 : daftar Fox & Group ================= */
const beList = $('#beList');
const CUBE_SVG = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' +
  '<polygon points="12,2 22,7.5 12,13 2,7.5" fill="#5e5e5e"/>' +
  '<polygon points="2,7.5 12,13 12,23.5 2,18" fill="#363636"/>' +
  '<polygon points="12,13 22,7.5 22,18 12,23.5" fill="#202020"/></svg>';
const GROUP_SVG = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' +
  '<circle cx="12" cy="12" r="6.2" fill="none" stroke="#3b3b3b" stroke-width="2.6"/>' +
  '<path d="M12 1.8v5M12 17.2v5M1.8 12h5M17.2 12h5" stroke="#555" stroke-width="2.6" stroke-linecap="round"/>' +
  '<circle cx="12" cy="12" r="1.9" fill="#222"/></svg>';
const CHEV_HTML = '<button class="chev" aria-label="Buka / tutup group"><svg viewBox="0 0 16 16"><path d="M3.5 6L8 10.5L12.5 6"/></svg></button>';
const TAIL_HTML = '<div class="tail"><button class="dots" aria-label="Menu"><i></i><i></i><i></i></button>' +
  '<div class="chk"><div class="box"><svg viewBox="0 0 16 16"><path d="M3.2 8.6L6.6 12L12.8 4.4"/></svg></div></div></div>';

/* tombol Add (berubah jadi Add Group saat mode select) dan Cancel */
const addRow = document.createElement('div');
addRow.className = 'row add-row';
addRow.innerHTML = '<div class="pw"><div class="fox-btn add"><span class="lbl a"></span><span class="lbl g">+ Add Group</span><span class="lbl m">+ Add Members</span></div></div>';
$('.lbl.a', addRow).textContent = ADD_LABEL;
addRow.addEventListener('click', () => {
  if (state.selMode === 'new') makeGroupFromChecked();
  else if (state.selMode === 'add') addMembersToTarget();
  else addFoxTop();
});
beList.appendChild(addRow);

const cancelRow = document.createElement('div');
cancelRow.className = 'row cancel-row';
cancelRow.innerHTML = '<div class="pw"><div class="fox-btn cancel"><span class="name">Cancel</span></div></div>';
cancelRow.addEventListener('click', () => { if (state.selMode) exitSelect(); });
beList.appendChild(cancelRow);

function layoutList() {
  let vis = 0;
  items.forEach(it => {
    const gi = vis;
    setRowState(it, false, gi, false);
    vis++;
    if (it.type === 'group') {
      it.row.classList.toggle('open', it.open);
      it.chev.classList.toggle('empty', it.children.length === 0);
      it.children.forEach(ch => {
        const hidden = !it.open;
        setRowState(ch, true, hidden ? gi : vis, hidden);
        if (!hidden) vis++;
      });
    }
  });
  addRow.style.setProperty('--i', vis);
  cancelRow.style.setProperty('--i', state.selMode ? vis + 1 : vis);
  beList.style.setProperty('--n', vis + (state.selMode ? 1 : 0));
}
function setRowState(n, child, i, hidden) {
  n.row.style.setProperty('--i', i);
  n.row.classList.toggle('child', child);
  n.row.classList.toggle('hid', hidden);
}
function syncSel() {
  flatNodes().forEach(n => n.btn.classList.toggle('sel', n === state.selected));
}
function afterStructure() {
  rebuildFlat(); layoutList(); syncSel(); refreshChecks(); requestRender();
}

function makeRow(n) {
  const isG = n.type === 'group';
  const row = document.createElement('div');
  row.className = 'row' + (isG ? ' grp-row open' : '');
  row.innerHTML = '<div class="pw"><div class="fox-btn ' + (isG ? 'grp' : 'fox') + '">' + (isG ? GROUP_SVG : CUBE_SVG) +
    '<span class="name"></span>' + (isG ? CHEV_HTML : '') + TAIL_HTML + '</div></div>';
  n.row = row;
  n.btn = $('.fox-btn', row);
  n.nameEl = $('.name', row);
  n.chk = $('.chk', row);
  n.dots = $('.dots', row);
  n.chev = isG ? $('.chev', row) : null;
  n.nameEl.textContent = n.name;
  n.btn.addEventListener('click', () => {
    if (state.selMode) toggleCheck(n); else select(n);
  });
  n.dots.addEventListener('click', e => { e.stopPropagation(); if (!state.selMode) openMenu(n, n.dots); });
  if (n.chev) n.chev.addEventListener('click', e => { e.stopPropagation(); toggleOpen(n); });
  beList.insertBefore(row, addRow);
}
function scrollListEnd() {
  setTimeout(() => { try { beList.scrollTo({ top: beList.scrollHeight, behavior: 'smooth' }); } catch (_) {} }, 60);
}

function addFoxTop() {
  const f = newFox();
  items.push(f);
  makeRow(f);
  afterStructure();
  select(f);
  scrollListEnd();
}
function toggleOpen(g) {
  g.open = !g.open;
  layoutList();
}
function select(n) {
  state.selected = n;
  syncSel(); syncFields(); syncExpr(); updateMainUI(); requestRender();
}

/* --- pindah induk --- */
function detach(f) {
  if (f.group) { const a = f.group.children; a.splice(a.indexOf(f), 1); }
  else { const i = items.indexOf(f); if (i >= 0) items.splice(i, 1); }
}
function reparent(f, g) {
  detach(f);
  f.group = g;
  g.children.push(f);
}
function ungroup(f) {
  const g = f.group;
  if (!g) return;
  detach(f);
  f.group = null;
  items.splice(items.indexOf(g) + 1, 0, f);
  afterStructure();
}

/* --- duplicate --- */
function duplicate(n) {
  if (n.type === 'fox') {
    const c = cloneFox(n);
    c.group = n.group;
    makeRow(c);
    const arr = n.group ? n.group.children : items;
    arr.splice(arr.indexOf(n) + 1, 0, c);
    afterStructure();
    select(c);
  } else {
    const g = newGroup();
    g.pos = n.pos.slice(); g.rot = n.rot.slice(); g.open = n.open;
    makeRow(g);
    items.splice(items.indexOf(n) + 1, 0, g);
    n.children.forEach(ch => { const c = cloneFox(ch); c.group = g; makeRow(c); g.children.push(c); });
    afterStructure();
    select(g);
  }
}

/* --- delete (Group ikut menghapus isinya) --- */
function deleteNode(n) {
  const doomed = n.type === 'group' ? [n].concat(n.children) : [n];
  const flat = flatNodes();
  let next = state.selected;
  if (doomed.indexOf(state.selected) >= 0) {
    const idx = flat.indexOf(n);
    next = flat[idx + doomed.length] || flat[idx - 1] || null;
  }
  detach(n);
  doomed.forEach(d => d.row.classList.add('removing'));
  rebuildFlat();
  select(next);
  requestRender();
  setTimeout(() => { doomed.forEach(d => d.row.remove()); layoutList(); }, 230);
}

/* --- mode select (kotak centang) ---
   'new' : dari menu Fox    -> tombol "+ Add Group" membuat Group baru berisi Fox yang dicentang
   'add' : dari menu Group  -> tombol "+ Add Members" memasukkan Fox yang dicentang ke Group itu
           (Group tersebut tidak punya kotak centang; anggotanya sendiri juga tidak bisa dicentang) */
const checked = new Set();
function isLocked(n) {                        // baris yang tidak boleh dicentang di mode 'add'
  return state.selMode === 'add' && !!state.selTarget && (n === state.selTarget || n.group === state.selTarget);
}
function refreshChecks() {
  flatNodes().forEach(n => {
    let on, dis, hide = false;
    if (n.type === 'group') {
      on = n.children.length > 0 && n.children.every(c => checked.has(c));
      dis = n.children.length === 0;
      hide = state.selMode === 'add' && n === state.selTarget;
    } else { on = checked.has(n); dis = isLocked(n); }
    n.chk.classList.toggle('on', on);
    n.chk.classList.toggle('dis', dis);
    n.chk.classList.toggle('hide', hide);
    n.btn.classList.toggle('target', state.selMode === 'add' && n === state.selTarget);
  });
}
function toggleCheck(n) {
  if (isLocked(n)) return;
  if (n.type === 'group') {
    if (!n.children.length) return;
    const all = n.children.every(c => checked.has(c));
    n.children.forEach(c => { if (all) checked.delete(c); else checked.add(c); });
  } else if (checked.has(n)) checked.delete(n);
  else checked.add(n);
  refreshChecks();
}
function enterSelect(mode, n) {
  closeMenu();
  state.selMode = mode;
  state.selTarget = mode === 'add' ? n : null;
  if (mode === 'add') n.open = true;
  checked.clear();
  beList.classList.add('selmode');
  beList.classList.toggle('selnew', mode === 'new');
  beList.classList.toggle('seladd', mode === 'add');
  refreshChecks();
  layoutList();
  if (mode === 'new') {
    setTimeout(() => {                        // centang muncul setelah ":" berubah jadi kotak
      if (state.selMode !== 'new') return;
      checked.add(n);
      refreshChecks();
    }, 240);
  }
}
function exitSelect() {
  state.selMode = null;
  state.selTarget = null;
  checked.clear();
  beList.classList.remove('selmode');
  beList.classList.remove('selnew');
  beList.classList.remove('seladd');
  refreshChecks();
  layoutList();
}
function makeGroupFromChecked() {
  const picked = flatNodes().filter(n => n.type === 'fox' && checked.has(n));
  const g = newGroup();
  let at = items.length;
  if (picked.length) at = items.indexOf(picked[0].group || picked[0]);
  items.splice(at, 0, g);
  makeRow(g);
  picked.forEach(f => reparent(f, g));
  exitSelect();
  afterStructure();
  select(g);
  scrollListEnd();
}
function addMembersToTarget() {
  const g = state.selTarget;
  if (!g) { exitSelect(); return; }
  const picked = flatNodes().filter(n => n.type === 'fox' && checked.has(n) && n.group !== g);
  picked.forEach(f => reparent(f, g));
  g.open = true;
  exitSelect();
  afterStructure();
  select(g);
}

/* --- menu ":" (Duplicate / Select|UnGroup / Delete) --- */
let menuNode = null;
const menuEl = $('#beMenu'), pillDup = $('#pillDup'), pillSel = $('#pillSel'), pillDl = $('#pillDl');
const lns = [$('.l1', menuEl), $('.l2', menuEl), $('.l3', menuEl)];
function openMenu(n, dotsBtn) {
  menuNode = n;
  pillSel.textContent = (n.type === 'fox' && n.group) ? 'UnGroup' : 'Select';
  const em = parseFloat(getComputedStyle(guiBE).fontSize) || 14;
  const pr = guiBE.getBoundingClientRect(), br = dotsBtn.getBoundingClientRect();
  const cx = br.left + br.width / 2 - pr.left, cy = br.top + br.height / 2 - pr.top;
  const pw = guiBE.offsetWidth, ph = guiBE.offsetHeight;
  menuEl.style.left = cx + 'px';
  menuEl.style.top = cy + 'px';
  function put(pill, line, dx, dy) {
    const hw = pill.offsetWidth / 2 + 4, hh = pill.offsetHeight / 2 + 4;
    dx = clamp(cx + dx * em, hw, pw - hw) - cx;     // tetap di dalam panel
    dy = clamp(cy + dy * em, hh, ph - hh) - cy;
    pill.style.left = dx + 'px'; pill.style.top = dy + 'px';
    line.style.setProperty('--len', Math.hypot(dx, dy) + 'px');
    line.style.setProperty('--ang', Math.atan2(dy, dx) + 'rad');
  }
  put(pillDup, lns[0], -4.5, -3.8);
  put(pillSel, lns[1], -6.9, 0);
  put(pillDl, lns[2], -4.5, 3.8);
  guiBE.classList.add('menu-open');
}
function closeMenu() { guiBE.classList.remove('menu-open'); }
$('#beDim').addEventListener('click', closeMenu);
$('#yb').addEventListener('click', closeMenu);
pillDup.addEventListener('click', () => { const n = menuNode; closeMenu(); if (n) setTimeout(() => duplicate(n), 140); });
pillSel.addEventListener('click', () => {
  const n = menuNode; closeMenu();
  if (!n) return;
  if (n.type === 'fox' && n.group) setTimeout(() => ungroup(n), 140);
  else enterSelect(n.type === 'group' ? 'add' : 'new', n);
});
pillDl.addEventListener('click', () => { const n = menuNode; closeMenu(); if (n) setTimeout(() => deleteNode(n), 160); });

/* ================= GUI 2 : Main ================= */
const fields = {};
$$('[data-k]').forEach(i => { fields[i.dataset.k] = i; });
const expEl = $('#exp');
const exprTab = $('.tab[data-tab="expr"]');
const scaleCol = $('#scaleCol');

function syncFields() {
  const s = state.selected, isG = !!s && s.type === 'group';
  Object.keys(fields).forEach(k => {
    if (k === 'snap') return;
    const inp = fields[k];
    inp.disabled = !s || (isG && (k === 'sxz' || k === 'sy'));
    if (document.activeElement === inp) return;
    inp.value = s ? fmt(toDisp(k, getVal(s, k))) : ((k === 'sxz' || k === 'sy') ? '1' : '0');
  });
}
function syncExpr() { expEl.textContent = exprFor(state.selected); }
function activateTab(name) {
  $$('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === name));
  $('#pane-prs').classList.toggle('active', name === 'prs');
  $('#pane-expr').classList.toggle('active', name === 'expr');
}
function updateMainUI() {                     // Group: tanpa Stop Expression & skala terkunci
  const isG = !!state.selected && state.selected.type === 'group';
  exprTab.classList.toggle('gone', isG);
  scaleCol.classList.toggle('locked', isG);
  if (isG) {
    if ($('#pane-expr').classList.contains('active')) activateTab('prs');
    if (state.mode === 'scale') setMode('position');
  }
}
const parseNum = s => parseFloat(String(s).replace(',', '.'));

Object.keys(fields).forEach(k => {
  const inp = fields[k];
  if (k === 'snap') {
    inp.value = fmt(state.snap);
    inp.addEventListener('input', () => { const v = parseNum(inp.value); state.snap = Number.isFinite(v) ? Math.max(0, v) : 0; });
    inp.addEventListener('blur', () => { inp.value = fmt(state.snap); });
  } else {
    inp.addEventListener('input', () => {
      const f = state.selected; if (!f) return;
      if (f.type === 'group' && (k === 'sxz' || k === 'sy')) return;
      const v = parseNum(inp.value);
      if (!Number.isFinite(v)) return;
      setVal(f, k, fromDisp(k, v)); syncExpr(); requestRender();
    });
    inp.addEventListener('blur', () => { const f = state.selected; if (f) inp.value = fmt(toDisp(k, getVal(f, k))); });
  }
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
});

function setMode(m) {
  if (m === 'scale' && state.selected && state.selected.type === 'group') return;
  state.mode = m;
  $$('.col').forEach(c => c.classList.toggle('active', c.dataset.mode === m));
  requestRender();
}
$$('.col').forEach(c => $('.colhead', c).addEventListener('click', () => setMode(c.dataset.mode)));
$$('.tab').forEach(t => t.addEventListener('click', () => activateTab(t.dataset.tab)));

const copyBtn = $('#copyBtn');
let copyTimer = 0;
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
  }
  return legacyCopy(text);
}
function legacyCopy(text) {
  return new Promise((res, rej) => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;left:-999px;top:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    ok ? res() : rej(new Error('copy gagal'));
  });
}
copyBtn.addEventListener('click', () => {
  copyText(expEl.textContent).then(() => {
    copyBtn.textContent = 'Copied!'; copyBtn.classList.remove('done'); void copyBtn.offsetWidth; copyBtn.classList.add('done');
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('done'); }, 1300);
  }).catch(() => {
    try {
      const r = document.createRange(); r.selectNodeContents(expEl);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    } catch (_) {}
  });
});

/* ================= mulai ================= */
try { updateUiScale(); } catch (e) { fail('ui', e); }
addFoxTop();                                  // GUI hidup dulu, sebelum 3D
try { initRenderer(); } catch (e) { fail('renderer', e); }
try { resizeCanvas(); } catch (e) { fail('resize', e); }
try { initialLayout(); } catch (e) { fail('layout', e); }

window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', () => setTimeout(relayout, 200));
window.addEventListener('load', relayout);
if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
if (typeof ResizeObserver !== 'undefined') {
  try {
    const ro = new ResizeObserver(() => { if (!userMoved) { try { initialLayout(); } catch (_) {} } });
    GUIS.forEach(g => ro.observe(g));
    ro.observe(stage);
  } catch (_) {}
}
setTimeout(relayout, 300);                    // jaga-jaga kalau ukuran iframe baru stabil belakangan
setTimeout(relayout, 1200);

(function loop() {
  requestAnimationFrame(loop);
  if (!dirty) return;
  dirty = false;
  if (cam.W < 2) return;
  try { renderAll(); } catch (e) { fail('render', e); }
})();

window.__fmbe = {
  state: state, items: items, cam: cam, orbit: orbit, checked: checked,
  computeGizmo: computeGizmo, hitTest: hitTest, renderAll: renderAll, updateCam: updateCam, project: project,
  viewMat: viewMat, projMat: projMat, modelMat: modelMat, blockXform: blockXform, mul4: mul4, exprFor: exprFor,
  eulerR: eulerR, gimbal: gimbal, toDisp: toDisp, flatNodes: flatNodes, renderFoxes: function () { return renderFoxes; },
  api: { addFoxTop: addFoxTop, select: select, duplicate: duplicate, deleteNode: deleteNode, ungroup: ungroup, enterSelect: enterSelect,
         exitSelect: exitSelect, toggleCheck: toggleCheck, makeGroupFromChecked: makeGroupFromChecked, toggleOpen: toggleOpen,
         addMembersToTarget: addMembersToTarget, setMode: setMode, openMenu: openMenu, syncFields: syncFields, setVal: setVal }
};
})();
