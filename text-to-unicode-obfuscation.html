<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171d24">
  <meta name="description" content="Easily convert plain text into Unicode escape sequences.">
  <title>Text to Unicode (Obfuscation)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11171e;
      --panel: rgba(35, 43, 52, .92);
      --panel-soft: #1c242d;
      --line: rgba(166, 190, 211, .15);
      --muted: #94a3b3;
      --text: #eef5fb;
      --cyan: #55d9f5;
      --purple: #a78bfa;
      --blue: #48a9f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 34px 18px;
      display: grid;
      place-items: center;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 14% 12%, rgba(77, 145, 190, .17), transparent 34%),
        radial-gradient(ellipse at 88% 82%, rgba(129, 91, 220, .15), transparent 35%),
        linear-gradient(145deg, #10161d 0%, #1b242d 52%, #11171e 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .17;
      background-image: linear-gradient(rgba(160,190,215,.08) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(160,190,215,.08) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .app {
      position: relative;
      width: min(100%, 760px);
      padding: clamp(22px, 5vw, 42px);
      border: 1px solid rgba(174, 199, 220, .19);
      border-radius: 25px;
      background: linear-gradient(145deg, rgba(43, 53, 63, .96), rgba(26, 33, 41, .97));
      box-shadow: 0 25px 80px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.045);
      backdrop-filter: blur(16px);
    }

    .topline {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 28px;
    }

    .logo {
      width: 66px;
      height: 66px;
      flex: 0 0 66px;
      object-fit: contain;
      border-radius: 15px;
      filter: drop-shadow(0 5px 12px rgba(70, 171, 232, .16));
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #83cce9;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 5vw, 37px);
      line-height: 1.12;
      letter-spacing: -.045em;
    }

    h1 span {
      display: block;
      margin-top: 5px;
      color: #a9b8c8;
      font-size: .57em;
      font-weight: 600;
      letter-spacing: .015em;
    }

    .intro {
      margin: 0 0 25px;
      color: #aab7c5;
      font-size: 14px;
      line-height: 1.7;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      padding: 5px;
      margin: 0 0 22px;
      border: 1px solid rgba(150, 178, 202, .16);
      border-radius: 13px;
      background: rgba(13, 19, 25, .56);
    }
    .mode-btn {
      min-height: 40px;
      padding: 8px 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #98a8b8;
      font: inherit;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: color .2s, background .2s, box-shadow .2s;
    }
    .mode-btn.active {
      color: #fff;
      background: linear-gradient(110deg, rgba(118, 82, 232, .9), rgba(57, 127, 233, .9), rgba(49, 189, 233, .82));
      box-shadow: 0 4px 14px rgba(87, 104, 226, .2);
    }

    .field-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 10px;
    }

    label.field-label {
      color: #e2eaf2;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .02em;
    }

    .counter {
      color: #8494a5;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 155px;
      resize: vertical;
      padding: 17px 18px;
      border: 1px solid rgba(150, 178, 202, .18);
      border-radius: 15px;
      outline: none;
      background: rgba(13, 19, 25, .72);
      color: #e8f3fc;
      font: 13px/1.75 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      transition: border-color .2s, box-shadow .2s;
    }

    textarea::placeholder { color: #657585; opacity: 1; }
    textarea:focus {
      border-color: rgba(93, 190, 244, .72);
      box-shadow: 0 0 0 3px rgba(73, 164, 230, .12);
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 13px 2px 20px;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #aab8c6;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }

    .check input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: #9b76f3;
      cursor: pointer;
    }

    .hint { color: #748596; font-size: 11px; }

    .convert-wrap { position: relative; margin: 0 0 25px; }
    .convert-btn {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      overflow: hidden;
      border: 0;
      border-radius: 14px;
      color: white;
      background: linear-gradient(110deg, #7652e8, #397fe9, #31bde9, #9d55e8, #7652e8);
      background-size: 300% 300%;
      box-shadow: 0 9px 25px rgba(87, 104, 226, .24), inset 0 1px 0 rgba(255,255,255,.24);
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .045em;
      cursor: pointer;
      animation: rgb-flow 5s ease infinite;
      transition: transform .18s, box-shadow .18s;
    }

    .convert-btn::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 1px;
      border-radius: 13px;
      background: linear-gradient(110deg, rgba(125, 83, 238, .88), rgba(45, 126, 228, .88), rgba(42, 186, 225, .88), rgba(161, 77, 223, .88));
      background-size: 300% 300%;
      animation: rgb-flow 5s ease infinite reverse;
    }

    .convert-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 13px 30px rgba(90, 113, 235, .35), 0 0 20px rgba(75, 190, 245, .14);
    }
    .convert-btn:active { transform: translateY(0) scale(.99); }
    .convert-btn:focus-visible, .small-btn:focus-visible { outline: 2px solid #a9eaff; outline-offset: 4px; }

    @keyframes rgb-flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .arrow { font-size: 19px; line-height: 1; }

    .result-head { margin-top: 1px; }
    .result-box { position: relative; }
    #output { min-height: 185px; padding-right: 18px; color: #9be7ff; overflow-wrap: anywhere; }

    .result-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }

    .small-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid rgba(145, 176, 204, .2);
      border-radius: 10px;
      background: rgba(79, 100, 122, .16);
      color: #d8e5f0;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .small-btn:hover { background: rgba(102, 132, 163, .24); border-color: rgba(145, 190, 224, .4); }
    .small-btn:disabled { opacity: .42; cursor: not-allowed; }
    #copyStatus { min-height: 16px; color: #81d9bf; font-size: 11px; }

    .footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      margin-top: 27px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
      color: #718294;
      font-size: 11px;
    }
    .footer a { color: #8dc8e8; text-decoration: none; }
    .footer a:hover { color: #c0a9ff; text-decoration: underline; }
    .links { display: flex; flex-wrap: wrap; gap: 14px; }

    @media (max-width: 520px) {
      body { padding: 16px 11px; }
      .app { padding: 23px 17px; border-radius: 20px; }
      .logo { width: 54px; height: 54px; flex-basis: 54px; }
      .topline { gap: 12px; margin-bottom: 22px; }
      textarea { min-height: 140px; padding: 14px; }
      .options { align-items: flex-start; flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <img class="logo" src="https://raw.githubusercontent.com/Bedrock-OSS/bedrock-wiki/refs/heads/wiki/docs/public/assets/images/discord/bao.png" alt="Logo">
      <div>
        <p class="eyebrow">Unicode converter</p>
        <h1>Text to Unicode <span>(Obfuscation)</span></h1>
      </div>
    </header>

    <div class="mode-switch" role="group" aria-label="Conversion mode">
      <button class="mode-btn active" id="encodeModeBtn" type="button" aria-pressed="true">Text → Unicode</button>
      <button class="mode-btn" id="decodeModeBtn" type="button" aria-pressed="false">Unicode → Text</button>
    </div>

    <section aria-labelledby="input-label">
      <div class="field-head">
        <label class="field-label" id="input-label" for="input">Text Input</label>
        <span class="counter" id="inputCount">0 character</span>
      </div>
      <textarea id="input" spellcheck="false" placeholder="Insert text here..."></textarea>
      <div class="options">
        <label class="check" for="escapeNewlines">
          <input type="checkbox" id="escapeNewlines" checked>
          Interpret \n as a new line
        </label>
        <span class="hint">Shortcut: Ctrl + Enter for convert</span>
      </div>
    </section>

    <div class="convert-wrap">
      <button class="convert-btn" id="convertBtn" type="button">
        <span class="arrow">↳</span> CONVERT TO UNICODE
      </button>
    </div>

    <section aria-labelledby="output-label">
      <div class="field-head result-head">
        <label class="field-label" id="output-label" for="output">Unicode Output</label>
        <span class="counter" id="outputCount">0 code</span>
      </div>
      <div class="result-box">
        <textarea id="output" readonly spellcheck="false" placeholder="The Unicode result will appear here..."></textarea>
      </div>
      <div class="result-actions">
        <span id="copyStatus" role="status" aria-live="polite"></span>
        <div style="display:flex; gap:8px;">
          <button class="small-btn" id="clearBtn" type="button">✕ Clear</button>
          <button class="small-btn" id="copyBtn" type="button" disabled>▢ Copy Output</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span>Runs locally in your browser · No text is uploaded</span>
      <nav class="links" aria-label="Referensi">
        <a href="https://wiki.bedrock.dev/text/fonts" target="_blank" rel="noopener noreferrer">Bedrock Fonts</a>
        <a href="https://wiki.bedrock.dev/text/emojis" target="_blank" rel="noopener noreferrer">Bedrock Emojis</a>
      </nav>
    </footer>
  </main>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const inputCount = document.getElementById('inputCount');
    const outputCount = document.getElementById('outputCount');
    const copyBtn = document.getElementById('copyBtn');
    const copyStatus = document.getElementById('copyStatus');
    const escapeNewlines = document.getElementById('escapeNewlines');
    const options = document.querySelector('.options');
    const inputLabel = document.getElementById('input-label');
    const outputLabel = document.getElementById('output-label');
    const convertBtn = document.getElementById('convertBtn');
    const encodeModeBtn = document.getElementById('encodeModeBtn');
    const decodeModeBtn = document.getElementById('decodeModeBtn');

    let mode = 'encode';

    function prepareText(value) {
      let text = value;
      if (escapeNewlines.checked) {
        text = text.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n').replace(/\\r/g, '\n');
      }
      return text.replace(/\r\n?/g, '\n');
    }

    function toUnicodeEscapes(value) {
      let result = '';
      for (let i = 0; i < value.length; i++) {
        result += '\\u' + value.charCodeAt(i).toString(16).toUpperCase().padStart(4, '0');
      }
      return result;
    }

    function fromUnicodeEscapes(value) {
      return value.replace(/\\u(?:\{([0-9a-fA-F]{1,6})\}|([0-9a-fA-F]{4}))/g, (match, braced, standard) => {
        const codePoint = parseInt(braced || standard, 16);
        return codePoint <= 0x10FFFF ? String.fromCodePoint(codePoint) : match;
      });
    }

    function setMode(nextMode) {
      mode = nextMode;
      const encoding = mode === 'encode';
      encodeModeBtn.classList.toggle('active', encoding);
      decodeModeBtn.classList.toggle('active', !encoding);
      encodeModeBtn.setAttribute('aria-pressed', String(encoding));
      decodeModeBtn.setAttribute('aria-pressed', String(!encoding));
      inputLabel.textContent = encoding ? 'Text Input' : 'Unicode Input';
      outputLabel.textContent = encoding ? 'Unicode Output' : 'Text Output';
      convertBtn.innerHTML = encoding
        ? '<span class="arrow">↳</span> CONVERT TO UNICODE'
        : '<span class="arrow">↳</span> CONVERT TO TEXT';
      input.placeholder = encoding ? 'Insert text here...' : 'Insert Unicode here...';
      output.placeholder = encoding ? 'Unicode output will appear here...' : 'Text output will appear here...';
      options.style.display = encoding ? 'flex' : 'none';
      output.style.color = encoding ? '#9be7ff' : '#e8f3fc';
      output.value = '';
      outputCount.textContent = '0 code';
      copyBtn.disabled = true;
      copyStatus.textContent = '';
    }

    function convert() {
      const result = mode === 'encode'
        ? toUnicodeEscapes(prepareText(input.value))
        : fromUnicodeEscapes(input.value);
      output.value = result;
      const count = result.length;
      outputCount.textContent = `${count.toLocaleString('id-ID')} ${mode === 'encode' ? 'code' : 'character'}`;
      copyBtn.disabled = result.length === 0;
      copyStatus.textContent = count ? 'Done.' : 'Input is empty.';
    }

    input.addEventListener('input', () => {
      inputCount.textContent = `${input.value.length.toLocaleString('id-ID')} character`;
      copyStatus.textContent = '';
    });

    encodeModeBtn.addEventListener('click', () => setMode('encode'));
    decodeModeBtn.addEventListener('click', () => setMode('decode'));
    convertBtn.addEventListener('click', convert);

    document.getElementById('clearBtn').addEventListener('click', () => {
      input.value = '';
      output.value = '';
      inputCount.textContent = '0 character';
      outputCount.textContent = '0 code';
      copyBtn.disabled = true;
      copyStatus.textContent = '';
      input.focus();
    });

    copyBtn.addEventListener('click', async () => {
      if (!output.value) return;
      try {
        await navigator.clipboard.writeText(output.value);
        copyStatus.textContent = 'Copied.';
      } catch (error) {
        output.focus();
        output.select();
        const copied = document.execCommand('copy');
        copyStatus.textContent = copied ? 'Copied.' : 'Copy manually.';
        output.setSelectionRange(0, 0);
      }
    });

    document.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
        event.preventDefault();
        convert();
      }
    });
  </script>
</body>
</html>
